  function restoreSnap(s){ const o=JSON.parse(s); board=o.board; bag=o.bag; players=o.players; turn=o.turn; boardCount=o.boardCount; passes=o.passes; gameOver=o.gameOver; lastPlaced=o.lastPlaced; tent=[]; active=null; tradeMode=false; tradeSel=new Set(); }
  function undo(){
    if(!hist.length){ setMsg("무를 수가 없어요.","bad"); return; }
    restoreSnap(hist.pop());
    if(mode==="cpu"){ let g=0; while(hist.length && turn===1 && g++<6) restoreSnap(hist.pop()); }
    revealed=false; document.querySelector(".overlay").classList.remove("show");
    render(); setMsg("한 수 물렀어요. 다시 두세요.","good");
  }
  function newGame(){
    hist=[];
    revealed=false;lastPlaced=[];gameOver=false;tent=[];active=null;tradeMode=false;tradeSel=new Set();passes=0;
    board=Array.from({length:BOARD},()=>Array(BOARD).fill(null));
    boardCount=0;
    bag=[];
    SHAPES.forEach(s=>COLORS.forEach(c=>{for(let k=0;k<NCOPY;k++) bag.push({shape:s.id,color:c.id});}));
    shuffle(bag);
    const names = mode==="cpu"?["나","컴퓨터"]:["플레이어 1","플레이어 2"];
    players=[{name:names[0],score:0,hand:[]},{name:names[1],score:0,hand:[]}];
    players.forEach(p=>{ while(p.hand.length<HAND) p.hand.push(bag.pop()); });
    turn=0;
    overlay.classList.remove("show");
    render();
    setMsg(`${players[0].name}부터 시작! 손에서 곤충을 골라 보드에 놓으세요. 첫 수는 아무 곳에나 한 줄로 놓을 수 있어요.`,"good");
  }

  // ---- tile lookup incl. tentative ----
  function tAt(r,c){
    if(!inB(r,c)) return null;
    const t=tent.find(x=>x.r===r&&x.c===c);
    return t?t.tile:board[r][c];
  }
  function runCells(r,c,orient){
    const cells=[{r,c}];
    const [dr,dc]=orient==="H"?[0,1]:[1,0];
    let rr=r+dr,cc=c+dc; while(tAt(rr,cc)){cells.push({r:rr,c:cc});rr+=dr;cc+=dc;}
    rr=r-dr;cc=c-dc; while(tAt(rr,cc)){cells.unshift({r:rr,c:cc});rr-=dr;cc-=dc;}
    return cells;
  }
  function validRun(tiles){
    const seen=new Set();
    for(const t of tiles){const k=t.shape+"|"+t.color; if(seen.has(k)) return {ok:false,reason:"한 줄에 똑같은 곤충을 두 번 놓을 수 없어요."}; seen.add(k);}
    const sameColor=tiles.every(t=>t.color===tiles[0].color);
    const sameShape=tiles.every(t=>t.shape===tiles[0].shape);
    if(sameColor||sameShape) return {ok:true};
    return {ok:false,reason:"한 줄은 ‘색이 같고 모양 다름’ 또는 ‘모양이 같고 색 다름’ 이어야 해요."};
  }
  // quick check used while building (only run legality)
  function runsOnly(){
    for(const t of tent){
      for(const o of ["H","V"]){
        const cells=runCells(t.r,t.c,o);
        if(cells.length>=2){ const v=validRun(cells.map(x=>tAt(x.r,x.c))); if(!v.ok) return v; }
      }
    }
    return {ok:true};
  }
  // full legality at commit
  function validate(){
    if(tent.length===0) return {ok:false,reason:"곤충을 한 개 이상 놓으세요."};
    const rows=new Set(tent.map(t=>t.r)), cols=new Set(tent.map(t=>t.c));
    const sameRow=rows.size===1, sameCol=cols.size===1;
    if(!sameRow&&!sameCol) return {ok:false,reason:"한 줄(가로 또는 세로)로만 놓을 수 있어요."};
    if(sameRow){ const r=[...rows][0], cs=tent.map(t=>t.c),lo=Math.min(...cs),hi=Math.max(...cs);
      for(let c=lo;c<=hi;c++) if(!tAt(r,c)) return {ok:false,reason:"놓은 곤충들 사이에 빈 칸이 있으면 안 돼요."}; }
    if(sameCol){ const c=[...cols][0], rs=tent.map(t=>t.r),lo=Math.min(...rs),hi=Math.max(...rs);
      for(let r=lo;r<=hi;r++) if(!tAt(r,c)) return {ok:false,reason:"놓은 곤충들 사이에 빈 칸이 있으면 안 돼요."}; }
    if(boardCount>0){
      const touch=tent.some(t=>ADJ.some(([dr,dc])=>inB(t.r+dr,t.c+dc)&&board[t.r+dr][t.c+dc]));
      if(!touch) return {ok:false,reason:"이미 놓인 곤충과 이어지게 놓아야 해요."};
    }
    return runsOnly();
  }
  function scoreMove(){
    const sigs=new Set(); let total=0,qw=0;
    for(const t of tent){
      for(const o of ["H","V"]){
        const cells=runCells(t.r,t.c,o);
        if(cells.length>=2){
          const sig=o+cells.map(x=>x.r+","+x.c).join(";");
          if(!sigs.has(sig)){ sigs.add(sig); total+=cells.length; if(cells.length===LINEMAX) qw++; }
        }
      }
    }
    if(total===0) total=1;
    total+=qw*LINEMAX;
    return {points:total,qwirkles:qw};
  }

  function canPlaceAt(r,c){
    if(tAt(r,c)) return false;
    if(boardCount===0 && tent.length===0) return true;
    return ADJ.some(([dr,dc])=>tAt(r+dr,c+dc)!=null);
  }

  // ---- rendering ----
  function tileHTML(tile,cls){
    return `<span class="tile ${cls||''}" style="color:${hexOf(tile.color)}">${svgOf(tile.shape)}</span>`;
  }
  function render(){
    const cpuTurn = mode==="cpu" && turn===1;
    const canInteract = !gameOver && !cpuTurn;
    // board
    boardEl.innerHTML="";
    for(let r=0;r<BOARD;r++)for(let c=0;c<BOARD;c++){
      const cell=document.createElement("button");
      cell.className="cell";cell.dataset.r=r;cell.dataset.c=c;
      const tt=tent.find(x=>x.r===r&&x.c===c);
      if(tt){ cell.innerHTML=tileHTML(tt.tile,"tent"); }
      else if(board[r][c]){ cell.innerHTML=tileHTML(board[r][c]); if(lastPlaced.includes(r+","+c)) cell.classList.add("lastmove"); }
      else if(canInteract && !tradeMode && active!=null && canPlaceAt(r,c)){ cell.classList.add("placeable"); }
      cell.addEventListener("click",()=>onCell(r,c));
      boardEl.appendChild(cell);
    }
    renderHand(cpuTurn);
    renderStatus();
    renderControls(canInteract);
  }
  function renderHand(cpuTurn){
    const p=players[turn];
    handEl.innerHTML="";
    if(cpuTurn){
      handLabel.textContent="컴퓨터가 생각하고 있어요…";
      for(let i=0;i<p.hand.length;i++){const b=document.createElement("div");b.className="back";handEl.appendChild(b);}
      return;
    }
    if(mode==="pvp" && !revealed && !tradeMode){
      handLabel.textContent=`${p.name}의 곤충 (${p.hand.length}개) — 상대에게 안 보이게 뒤집어 뒀어요`;
      for(let i=0;i<p.hand.length;i++){const b=document.createElement("div");b.className="back";handEl.appendChild(b);}
      const rb=document.createElement("button"); rb.textContent="패 보기 👀";
      rb.style.cssText="font-family:Jua;font-size:13px;border:none;border-radius:10px;padding:6px 14px;margin-left:8px;cursor:pointer;color:#fff;background:var(--gold,#c79a2e);";
      rb.addEventListener("click",()=>{revealed=true;render();}); handEl.appendChild(rb);
      return;
    }
    handLabel.textContent = tradeMode ? "바꿀 곤충을 고르고 ‘교환 확정’을 누르세요" : `${p.name}의 곤충 (${p.hand.length}개)`;
    p.hand.forEach((tile,i)=>{
      const el=document.createElement("button");
      el.innerHTML=tileHTML(tile);
      const t=el.firstChild;
      if(active===i && !tradeMode) t.classList.add("active");
      if(tradeMode && tradeSel.has(i)) t.classList.add("trade");
      el.style.cssText="border:none;background:none;padding:0;cursor:pointer;";
      el.addEventListener("click",()=>onHand(i));
      handEl.appendChild(el);
    });
  }
  function renderStatus(){
    const cpu=mode==="cpu";
    statusEl.innerHTML="";
    players.forEach((p,i)=>{
      const d=document.createElement("div");
      d.className="chip "+(i===0?"me":"op")+(i===turn&&!gameOver?" turn":"");
      d.innerHTML=`${cpu&&i===1?"🤖":(i===0?"🙂":"😎")} ${p.name} <b>${p.score}</b>점`;
      statusEl.appendChild(d);
    });
    const b=document.createElement("div");b.className="chip";b.innerHTML=`🎒 가방 ${bag.length}개`;statusEl.appendChild(b);
  }
  function renderControls(canInteract){
    controlsEl.innerHTML="";
    if(!canInteract){ return; }
    if(tradeMode){
      addBtn("교환 확정","gold",confirmTrade);
      addBtn("취소","ghost",()=>{tradeMode=false;tradeSel.clear();setMsg("교환을 취소했어요.","good");render();});
      return;
    }
    const v=validate();
    addBtn("확정","",commitTurn, !(v.ok));
    addBtn("되돌리기","ghost",undoTent, tent.length===0);
    addBtn("타일 교환","ghost",()=>{ if(tent.length){setMsg("먼저 ‘되돌리기’로 놓은 곤충을 거둬주세요.","bad");return;} if(bag.length===0){setMsg("가방이 비어서 교환할 수 없어요.","bad");return;} tradeMode=true;tradeSel.clear();setMsg("바꿀 곤충을 고르고 ‘교환 확정’을 누르세요.","good");render(); }, bag.length===0);
    addBtn("패스","ghost",passTurn);
  }
  function addBtn(label,cls,fn,disabled){
    const b=document.createElement("button");b.className="btn"+(cls?(" "+cls):"");b.textContent=label;
    if(disabled) b.disabled=true; else b.addEventListener("click",fn);
    controlsEl.appendChild(b);
  }
  function setMsg(t,kind){msgEl.innerHTML=t;msgEl.className="message"+(kind?(" "+kind):"");}

  // ---- interaction ----
  function onHand(i){
    if(gameOver) return;
    if(mode==="cpu"&&turn===1) return;
    if(tradeMode){ if(tradeSel.has(i))tradeSel.delete(i); else tradeSel.add(i); render(); return; }
    active = (active===i)?null:i;
    render();
    if(active!=null) setMsg("놓을 칸을 누르세요. (초록 점선 칸에 놓을 수 있어요)","good");
  }
  function onCell(r,c){
    if(gameOver||tradeMode) return;
    if(mode==="cpu"&&turn===1) return;
    // pick up a tentative tile
    const ti=tent.findIndex(x=>x.r===r&&x.c===c);
    if(ti>=0){ const [t]=tent.splice(ti,1); players[turn].hand.push(t.tile); active=null; render(); setMsg("곤충을 손으로 다시 가져왔어요.","good"); return; }
    if(active==null){ setMsg("먼저 손에서 곤충을 골라주세요.","bad"); return; }
    if(!canPlaceAt(r,c)){ setMsg(boardCount===0?"첫 곤충을 보드 가운데쯤에 놓아보세요.":"이미 놓인 곤충 옆(위·아래·양옆)에 이어 놓아야 해요.","bad"); return; }
    const tile=players[turn].hand[active];
    tent.push({r,c,tile});
    // collinear check while building
    const rows=new Set(tent.map(t=>t.r)),cols=new Set(tent.map(t=>t.c));
    if(rows.size>1 && cols.size>1){ tent.pop(); setMsg("한 줄(가로 또는 세로)로만 놓을 수 있어요.","bad"); return; }
    const chk=runsOnly();
    if(!chk.ok){ tent.pop(); setMsg(chk.reason,"bad"); return; }
    players[turn].hand.splice(active,1);
    active=null;
    render();
    const v=validate();
    setMsg(v.ok?`좋아요! 지금 놓으면 <b>${scoreMove().points}</b>점. 더 놓거나 ‘확정’을 누르세요.`:"계속 놓거나, 규칙에 맞게 이어주세요.","good");
  }
  function undoTent(){
    tent.forEach(t=>players[turn].hand.push(t.tile));
    tent=[];active=null;render();setMsg("놓았던 곤충을 모두 거뒀어요.","good");
  }
  function passTurn(){
    if(tent.length){ setMsg("놓은 곤충이 있어요. ‘확정’ 또는 ‘되돌리기’를 먼저 하세요.","bad"); return; }
    pushHist(); passes++; nextTurn(`${players[turn].name}이(가) 패스했어요.`);
  }

  function commitTurn(){
    const v=validate();
    if(!v.ok){ setMsg(v.reason,"bad"); return; }
    pushHist();
    const sc=scoreMove();
    lastPlaced=tent.map(t=>t.r+","+t.c); tent.forEach(t=>{ board[t.r][t.c]=t.tile; boardCount++; });
    const p=players[turn]; p.score+=sc.points;
    const placed=tent.length; tent=[];active=null;passes=0;
    refill(p);
    if(sc.qwirkles>0) celebrate("쿼클!! 🎉");
    if(bag.length===0 && p.hand.length===0){ p.score+=LINEMAX; render(); endGame(); return; }
    nextTurn(`${p.name}: ${sc.points}점! ${sc.qwirkles?"쿼클 완성! ":""}(곤충 ${placed}개)`, sc.qwirkles>0?"good":"good");
  }
  function refill(p){ while(p.hand.length<HAND && bag.length>0) p.hand.push(bag.pop()); }

  function confirmTrade(){
    if(!(tradeMode&&tradeSel.size)) {} else pushHist();
    if(tradeSel.size===0){ setMsg("바꿀 곤충을 골라주세요.","bad"); return; }
    const p=players[turn];
    const idxs=[...tradeSel].sort((a,b)=>b-a);
    idxs.forEach(i=>{ bag.push(p.hand[i]); p.hand.splice(i,1); });
    shuffle(bag); refill(p);
    tradeMode=false; tradeSel.clear(); active=null; passes=0;
    nextTurn(`${p.name}이(가) 곤충 ${idxs.length}개를 바꿨어요.`);
  }

  function nextTurn(msg){
    if(passes>=2){ render(); endGame(); return; }
    turn=1-turn; active=null; revealed=false;
    render();
    if(msg) setMsg(msg,"good");
    if(mode==="cpu" && turn===1 && !gameOver){ setTimeout(aiTurn, 650); }
  }

  // ---- AI (greedy) ----
  function candidateCells(){
    if(boardCount===0) return [{r:CENTER,c:CENTER}];
    const set=new Set(),out=[];
    for(let r=0;r<BOARD;r++)for(let c=0;c<BOARD;c++){
      if(board[r][c]) { ADJ.forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc; if(inB(rr,cc)&&!board[rr][cc]){const k=rr+","+cc; if(!set.has(k)){set.add(k);out.push({r:rr,c:cc});}}}); }
    }
    return out;
  }
  function neighborsOf(cur){
    const set=new Set(),out=[];
    const consider=(rr,cc)=>{ if(inB(rr,cc)&&!tAt(rr,cc)){const k=rr+","+cc; if(!set.has(k)){set.add(k);out.push({r:rr,c:cc});}} };
    if(boardCount>0) for(let r=0;r<BOARD;r++)for(let c=0;c<BOARD;c++){ if(board[r][c]) ADJ.forEach(([dr,dc])=>consider(r+dr,c+dc)); }
    cur.forEach(t=>ADJ.forEach(([dr,dc])=>consider(t.r+dr,t.c+dc)));
    return out;
  }
  function aiFindBest(hand){
    let best=null;
    const seeds=candidateCells();
    for(let hi=0;hi<hand.length;hi++){
      for(const cell of seeds){
        tent=[{r:cell.r,c:cell.c,tile:hand[hi]}];
        if(!validate().ok){ tent=[]; continue; }
        const used=new Set([hi]);
        let improved=true;
        while(improved){
          improved=false; let add=null,addScore=-1;
          for(let hj=0;hj<hand.length;hj++){
            if(used.has(hj)) continue;
            for(const cell2 of neighborsOf(tent)){
              tent.push({r:cell2.r,c:cell2.c,tile:hand[hj]});
              if(validate().ok){ const s=scoreMove().points; if(s>addScore){addScore=s;add={hj,cell2};} }
              tent.pop();
            }
          }
          if(add){ tent.push({r:add.cell2.r,c:add.cell2.c,tile:hand[add.hj]}); used.add(add.hj); improved=true; }
        }
        const pts=scoreMove().points;
        if(!best||pts>best.points){ best={cells:tent.map(t=>({r:t.r,c:t.c})),used:[...used],points:pts,q:scoreMove().qwirkles}; }
        tent=[];
      }
    }
    return best;
  }
  function aiTurn(){
    if(gameOver||!(mode==="cpu"&&turn===1)) return;
    pushHist();
    const p=players[1];
    const best=aiFindBest(p.hand);
    tent=[];
    if(best && best.points>0){
      // apply — keep cells[k] paired with used[k] (do NOT reorder)
      const tiles=best.used.map(i=>p.hand[i]);
      lastPlaced=best.cells.map(c=>c.r+","+c.c); best.cells.forEach((cell,k)=>{ board[cell.r][cell.c]=tiles[k]; boardCount++; });
      best.used.slice().sort((a,b)=>b-a).forEach(i=>p.hand.splice(i,1));
      p.score+=best.points; passes=0;
      refill(p);
      if(best.q>0) celebrate("쿼클!! 🎉");
      if(bag.length===0 && p.hand.length===0){ p.score+=LINEMAX; render(); endGame(); return; }
      nextTurn(`🤖 컴퓨터: ${best.points}점! ${best.q?"쿼클 완성! ":""}`);
    } else {
      // trade or pass
      if(bag.length>0){
        const n=Math.min(3,p.hand.length);
        for(let i=0;i<n;i++){ bag.push(p.hand.pop()); }
        shuffle(bag); refill(p); passes=0;
        nextTurn("🤖 컴퓨터가 곤충을 바꿨어요.");
      } else {
        passes++; nextTurn("🤖 컴퓨터가 패스했어요.");
      }
    }
  }

  // ---- effects ----
  function celebrate(text){
    if(fx){ const t=document.createElement("div");t.className="toast";t.textContent=text;fx.appendChild(t);setTimeout(()=>t.remove(),1450); }
    fireworks(1500);
  }
  function fireworks(dur){
    if(!fx||REDUCE) return;
    const end=Date.now()+(dur||2600);
    (function boom(){ burst(); if(Date.now()<end) setTimeout(boom,300); })();
  }
  function burst(){
    const cols=["#ff5c5c","#ffce6b","#7be08a","#6cc5ff","#e58ad0","#fff59a","#57c4c0"];
    const cx=10+Math.random()*80, cy=12+Math.random()*44, n=20;
    for(let i=0;i<n;i++){
      const p=document.createElement("div");p.className="fw";const col=cols[(Math.random()*cols.length)|0];
      p.style.color=col;p.style.background=col;p.style.left=cx+"vw";p.style.top=cy+"vh";fx.appendChild(p);
      const ang=(i/n)*Math.PI*2,dist=60+Math.random()*70;
      p.animate([{transform:"translate(-50%,-50%) scale(1.1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px)) scale(.3)`,opacity:0}],{duration:850+Math.random()*450,easing:"cubic-bezier(.15,.7,.3,1)"});
      setTimeout(()=>p.remove(),1400);
    }
  }

  function endGame(){
    gameOver=true;render();
    const s0=players[0].score,s1=players[1].score;
    let win = s0===s1?-1:(s0>s1?0:1);
    mBig.textContent = win===-1?"🤝":"🏆";
    if(win===-1) mTitle.textContent="무승부!";
    else if(mode==="cpu") mTitle.textContent = win===0?"내가 이겼어요! 🎉":"컴퓨터 승리…";
    else mTitle.textContent = players[win].name+" 승리! 🎉";
    mScore.innerHTML=`<div class="${win===0?'win':''}">${players[0].name} — ${s0}점</div><div class="${win===1?'win':''}">${players[1].name} — ${s1}점</div>`;
    overlay.classList.add("show");
    if(win!==-1) fireworks(2800);
    setMsg("게임 끝! 결과를 확인하세요.","good");
  }

  function buildLegend(){
    legendEl.innerHTML="";
    SHAPES.forEach(s=>{ const el=document.createElement("span"); el.innerHTML=`<span class="tile lt" style="color:#cbd6df">${s.svg}</span>${s.name}`; legendEl.appendChild(el); });
    const cs=document.createElement("span"); cs.innerHTML="색: "+COLORS.map(c=>`<b style="color:${c.hex}">${c.name}</b>`).join(" · "); legendEl.appendChild(cs);
  }

  modeSeg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...modeSeg.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;newGame();});
  resetBtn.addEventListener("click",newGame);
  var _ub=document.getElementById("undoBtn"); if(_ub) _ub.addEventListener("click",undo);
  mBtn.addEventListener("click",function(){document.querySelector(".overlay").classList.remove("show");});
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("show");});

  mode="cpu";
  buildLegend();
  newGame();
})();
</script>

    <li>② 칸과 칸 사이에 <b>울타리 1개</b> 세우기(밝은 칸=이동, 칸 사이=울타리).</li></ul>
    <h4>상대 말을 만나면 (점프)</h4>
    <ul><li>바로 앞 칸에 <b>상대 말</b>이 있으면 그 말을 <b>뛰어넘어</b> 그 너머 칸으로 갈 수 있어요.</li>
    <li>너머가 <b>울타리나 판 끝으로 막혀</b> 있으면, 상대 말 <b>옆(대각선)</b>으로 돌아갈 수 있어요.</li></ul>
    <h4>울타리 규칙</h4>
    <ul><li>울타리는 <b>두 칸 길이</b>로 길을 막아요.</li>
    <li>이미 있는 울타리와 <b>겹치거나 십자로 교차</b>할 수 없어요.</li>
    <li>어떤 말이든 도착지로 가는 길을 <b>완전히 막을 수는 없어요</b>(항상 길이 하나는 남아야 해요).</li>
    <li>울타리 개수: <b>2인은 각 10개</b>, <b>넷이서는 각 5개.</b> 다 쓰면 이동만 할 수 있어요.</li></ul>
    <h4>모드</h4><ul><li><b>컴퓨터와 · 둘이서 · 넷이서.</b></li></ul>
     <div class="tapclose">설명서를 누르면 닫혀요</div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <h1>🐝 곤충 울타리 대결</h1>
    <p class="subtitle">내 곤충을 반대편 끝까지 먼저 데려가면 이겨요! 내 차례엔 <b>말을 한 칸 옮기거나</b>(밝은 칸) 칸 사이에 <b>울타리</b>를 세워 상대를 막을 수 있어요. 단, 상대의 길을 완전히 막을 순 없어요.</p>
  </header>

  <div class="seg-wrap">
    <div class="seg" id="modeSeg" role="tablist" aria-label="게임 모드">
      <button data-mode="cpu" class="on">컴퓨터와</button>
      <button data-mode="two">둘이서</button>
      <button data-mode="four">넷이서</button>
    </div>
    <div class="seg" id="diffSeg" role="tablist" aria-label="난이도">
      <button data-diff="easy">쉬움</button>
      <button data-diff="normal" class="on">보통</button>
      <button data-diff="hard">어려움</button>
    </div>
  </div>

  <div class="players" id="players"></div>

  <div class="board-card"><div class="board" id="board" role="grid" aria-label="울타리 대결 보드"></div></div>

  <div class="message good" id="message"></div>
  <div class="controls">
    <button class="btn ghost" id="undoBtn">↩ 무르기</button>
    <button class="btn ghost" id="resetBtn">새 게임</button>
    <div class="wallbar" id="wallbar"></div>
  </div>

  <div class="legend" id="legend"></div>
</div>

<div id="fx"></div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tok" id="mTok"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <button class="btn" id="mBtn">확인</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const N=9;

  // ---- insect pieces (white icon on colored disc) ----
  const ICONS={
    hornet:`<g fill="#fff"><ellipse cx="28" cy="44" rx="15" ry="8.5" transform="rotate(-28 28 44)" opacity=".9"/><ellipse cx="72" cy="44" rx="15" ry="8.5" transform="rotate(28 72 44)" opacity=".9"/><ellipse cx="50" cy="56" rx="15" ry="27"/><circle cx="50" cy="26" r="10"/></g><g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"><path d="M45 19 L39 8"/><path d="M55 19 L61 8"/></g><g fill="rgba(0,0,0,.34)"><rect x="36" y="47" width="28" height="6" rx="3"/><rect x="37" y="59" width="26" height="6" rx="3"/><rect x="40" y="71" width="20" height="5" rx="2.5"/></g><path d="M50 83 L45.5 91 L54.5 91 Z" fill="#fff"/>`,
    mantis:`<g fill="#fff"><path d="M50 9 L63 27 L37 27 Z"/><ellipse cx="50" cy="60" rx="8.5" ry="30"/><path d="M41 31 q-19 -1 -22 -19 q-1 -7 5 -6 q2 11 12 14 q7 2 7 7 z"/><path d="M59 31 q19 -1 22 -19 q1 -7 -5 -6 q-2 11 -12 14 q-7 2 -7 7 z"/></g><g fill="rgba(0,0,0,.42)"><circle cx="44" cy="20" r="2.6"/><circle cx="56" cy="20" r="2.6"/></g><g stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M46 12 L40 3"/><path d="M54 12 L60 3"/></g>`,
    stag:`<g fill="#fff"><path d="M42 24 q-15 -7 -18 -21 q8 5 13 3 q6 -2 9 5 z"/><path d="M58 24 q15 -7 18 -21 q-8 5 -13 3 q-6 -2 -9 5 z"/><ellipse cx="50" cy="31" rx="11" ry="8"/><ellipse cx="50" cy="61" rx="18" ry="24"/></g><g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"><path d="M33 51 L20 45"/><path d="M33 63 L18 63"/><path d="M33 75 L20 83"/><path d="M67 51 L80 45"/><path d="M67 63 L82 63"/><path d="M67 75 L80 83"/></g><path d="M50 41 L50 83" stroke="rgba(0,0,0,.3)" stroke-width="3" fill="none"/>`,
    rhino:`<g fill="#fff"><ellipse cx="50" cy="50" rx="3.6" ry="26"/><circle cx="50" cy="23" r="4"/><path d="M48 40 C30 20 12 26 14 42 C16 56 34 54 48 48 Z"/><path d="M52 40 C70 20 88 26 86 42 C84 56 66 54 52 48 Z"/><path d="M48 52 C34 58 20 60 22 74 C24 86 42 80 48 66 Z"/><path d="M52 52 C66 58 80 60 78 74 C76 86 58 80 52 66 Z"/></g><g stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M47 20 C40 10 34 8 30 6"/><path d="M53 20 C60 10 66 8 70 6"/></g><g fill="rgba(0,0,0,.26)"><circle cx="30" cy="38" r="3.2"/><circle cx="70" cy="38" r="3.2"/><circle cx="33" cy="66" r="2.4"/><circle cx="67" cy="66" r="2.4"/></g>`,
  };
  const INSECT={
    hornet:{name:"말벌", color:"var(--hornet)"},
    mantis:{name:"사마귀", color:"var(--mantis)"},
    stag:{name:"사슴벌레", color:"var(--stag)"},
    rhino:{name:"나비", color:"var(--rhino)"},
  };
  function tokenHTML(insectId, active){
    return `<span class="tok${active?' act':''}" style="background:radial-gradient(circle at 34% 26%, #ffffff55, transparent 46%), ${INSECT[insectId].color}">`
      + `<svg viewBox="0 0 100 100" aria-hidden="true">${ICONS[insectId]}</svg></span>`;
  }

  // slot definitions: where each side starts and which edge is its goal
  const SLOT={
    bottom:{insect:"stag",  start:{r:8,c:4}, goal:{type:"row",val:0}, dir:"위"},
    top:   {insect:"hornet",start:{r:0,c:4}, goal:{type:"row",val:8}, dir:"아래"},
    left:  {insect:"mantis",start:{r:4,c:0}, goal:{type:"col",val:8}, dir:"오른쪽"},
    right: {insect:"rhino", start:{r:4,c:8}, goal:{type:"col",val:0}, dir:"왼쪽"},
  };
  const GTINT={hornet:"var(--hornet)",mantis:"var(--mantis)",stag:"var(--stag)",rhino:"var(--rhino)"};

  // ---- state ----
  let mode="cpu";
  let diff="normal";
  let players=[];        // {slot,insect,r,c,walls,goal,dir,name,cpu}
  let H=new Set(), V=new Set();
  let turn=0, gameOver=false, cpuThinking=false;
  let legalSet=new Set();
  let pendingWall=null;
  let hist=[];
  let lastPawn=null,lastWall=null,winnerIdx=-1;

  const boardEl=document.getElementById("board");
  const playersEl=document.getElementById("players");
  const msgEl=document.getElementById("message");
  const legendEl=document.getElementById("legend");
  const modeSeg=document.getElementById("modeSeg");
  const diffSeg=document.getElementById("diffSeg");
  const resetBtn=document.getElementById("resetBtn");
  const overlay=document.getElementById("overlay");
  const mTok=document.getElementById("mTok"), mTitle=document.getElementById("mTitle"), mText=document.getElementById("mText"), mBtn=document.getElementById("mBtn");
  const fx=document.getElementById("fx");
  const REDUCE=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const delay=ms=>new Promise(r=>setTimeout(r,ms));

  function makePlayer(slot,cpu,insectOverride){
    const s=SLOT[slot]; const insect=insectOverride||s.insect;
    return {slot,insect,r:s.start.r,c:s.start.c,walls:0,goal:s.goal,dir:s.dir,name:INSECT[insect].name,cpu:!!cpu};
  }
  function snap(){ return JSON.stringify({P:players.map(p=>({r:p.r,c:p.c,walls:p.walls})),H:[...H],V:[...V],turn:turn,pendingWall:pendingWall,gameOver:gameOver,winnerIdx:winnerIdx,lastPawn:lastPawn,lastWall:lastWall}); }
  function pushHist(){ hist.push(snap()); if(hist.length>80) hist.shift(); }
  function restoreSnap(s){ const o=JSON.parse(s); o.P.forEach((pp,i)=>{ if(players[i]){players[i].r=pp.r;players[i].c=pp.c;players[i].walls=pp.walls;} }); H=new Set(o.H); V=new Set(o.V); turn=o.turn; pendingWall=o.pendingWall; gameOver=o.gameOver; winnerIdx=o.winnerIdx; lastPawn=o.lastPawn; lastWall=o.lastWall; }
  function undo(){
    if(!hist.length){ setMsg("무를 수가 없어요.","warn"); return; }
    restoreSnap(hist.pop());
    let g=0; while(hist.length && players[turn] && players[turn].cpu && g++<8) restoreSnap(hist.pop());
    cpuThinking=false; pendingWall=null; overlay.classList.remove("show"); render();
    setMsg("한 수 물렀어요. 다시 두세요.","good");
  }
  function newGame(){
    hist=[];
    H=new Set();V=new Set();gameOver=false;cpuThinking=false;turn=0;pendingWall=null;lastPawn=null;lastWall=null;winnerIdx=-1;
    overlay.classList.remove("show");
    if(mode==="four"){
      players=[makePlayer("bottom"),makePlayer("top"),makePlayer("left"),makePlayer("right")];
      players.forEach(p=>p.walls=5);
    }else{
      players=[makePlayer("bottom", false, "mantis"), makePlayer("top", mode==="cpu", "rhino")];
      players.forEach(p=>p.walls=10);
    }
    render();
    const first=players[0];
    setMsg(`${first.name} 차례! 밝은 칸으로 옮기거나, 칸 사이를 눌러 울타리를 세우세요.`,"good");
  }

  // ---- geometry / rules ----
  const inB=(r,c)=>r>=0&&c>=0&&r<N&&c<N;
  const ADJ=[[-1,0],[1,0],[0,-1],[0,1]];
  const wH=(r,c)=>H.has(r+","+c);
  const wV=(r,c)=>V.has(r+","+c);
  function blocked(r,c,nr,nc){
    if(nr===r+1&&nc===c) return wH(r,c)||wH(r,c-1);
    if(nr===r-1&&nc===c) return wH(r-1,c)||wH(r-1,c-1);
    if(nc===c+1&&nr===r) return wV(r,c)||wV(r-1,c);
    if(nc===c-1&&nr===r) return wV(r,c-1)||wV(r-1,c-1);
    return true;
  }
  const occupant=(r,c)=>players.findIndex(p=>p.r===r&&p.c===c);

  function legalMoves(i){
    const me=players[i], out=[]; const push=(r,c)=>{if(!out.some(o=>o.r===r&&o.c===c))out.push({r,c});};
    for(const [dr,dc] of ADJ){
      const nr=me.r+dr,nc=me.c+dc;
      if(!inB(nr,nc)||blocked(me.r,me.c,nr,nc)) continue;
      if(occupant(nr,nc)<0){ push(nr,nc); continue; }
      // jump straight
      const br=nr+dr, bc=nc+dc;
      if(inB(br,bc)&&!blocked(nr,nc,br,bc)&&occupant(br,bc)<0){ push(br,bc); }
      else{
        // diagonal around the blocked/edge
        const perp = dr===0 ? [[-1,0],[1,0]] : [[0,-1],[0,1]];
        for(const [pr,pc] of perp){
          const dr2=nr+pr, dc2=nc+pc;
          if(inB(dr2,dc2)&&!blocked(nr,nc,dr2,dc2)&&occupant(dr2,dc2)<0) push(dr2,dc2);
        }
      }
    }
    return out;
  }

  const goalPred=p=> p.goal.type==="row" ? (r,c)=>r===p.goal.val : (r,c)=>c===p.goal.val;

  function bfs(sr,sc,pred){
    const dist=new Int16Array(N*N).fill(-1);
    const prev=new Int16Array(N*N).fill(-1);
    const key=(r,c)=>r*N+c;
    let q=[[sr,sc]]; dist[key(sr,sc)]=0; let gk=-1; let head=0;
    while(head<q.length){
      const [r,c]=q[head++];
      if(pred(r,c)){ gk=key(r,c); break; }
      for(const [dr,dc] of ADJ){
        const nr=r+dr,nc=c+dc;
        if(!inB(nr,nc)||blocked(r,c,nr,nc)) continue;
        const k=key(nr,nc);
        if(dist[k]===-1){ dist[k]=dist[key(r,c)]+1; prev[k]=key(r,c); q.push([nr,nc]); }
      }
    }
    if(gk===-1) return {dist:Infinity,next:null};
    let k=gk, sk=key(sr,sc);
    if(k===sk) return {dist:0,next:null};
    while(prev[k]!==sk && prev[k]!==-1) k=prev[k];
    return {dist:dist[gk], next:{r:(k/N)|0, c:k%N}};
  }
  function allHavePath(){ return players.every(p=>bfs(p.r,p.c,goalPred(p)).dist!==Infinity); }

  function canPlaceWall(o,r,c){
    if(r<0||r>7||c<0||c>7) return false;
    if(o==="H"){ if(wH(r,c)||wH(r,c-1)||wH(r,c+1)||wV(r,c)) return false; }
    else       { if(wV(r,c)||wV(r-1,c)||wV(r+1,c)||wH(r,c)) return false; }
    const set = o==="H"?H:V; set.add(r+","+c);
    const ok=allHavePath();
    set.delete(r+","+c);
    return ok;
  }

  // ---- rendering ----
  function render(){
    // legal moves for the current player (for highlight + click)
    legalSet=new Set();
    if(!gameOver){ legalMoves(turn).forEach(m=>legalSet.add(m.r+","+m.c)); }
    renderPlayers();
    renderBoard();
    renderWallbar();
    renderLegend();
  }
  function isInteractive(){ return !gameOver && !cpuThinking && !players[turn].cpu; }

  function renderPlayers(){
    playersEl.innerHTML="";
    players.forEach((p,i)=>{
      const b=document.createElement("div");
      b.className="pbadge"+(i===turn&&!gameOver?" turn":"")+(i===winnerIdx?" win":"");
      if(i===turn&&!gameOver) b.style.setProperty('--tc', INSECT[p.insect].color);
      b.innerHTML=tokenHTML(p.insect,false)+
        `<span class="pinfo"><span class="pname">${i===winnerIdx?"🏆 ":""}${p.name}${p.cpu?" 🤖":""}</span><br><span class="pwalls">울타리 <b>${p.walls}</b>개 · →${p.dir}</span></span>`;
      playersEl.appendChild(b);
    });
  }

  function goalClassFor(r,c){
    // returns [className, tintColor] if this cell is on some in-play player's goal edge
    for(const p of players){
      if(p.goal.type==="row" && r===p.goal.val) return [p.goal.val===0?"goal-top":"goal-bottom", GTINT[p.insect]];
      if(p.goal.type==="col" && c===p.goal.val) return [p.goal.val===0?"goal-left":"goal-right", GTINT[p.insect]];
    }
    return null;
  }

  function renderBoard(){
    boardEl.innerHTML="";
    for(let R=0;R<17;R++){
      for(let C=0;C<17;C++){
        const evenR=R%2===0, evenC=C%2===0;
        const el=document.createElement("div");
        if(evenR&&evenC){
          const r=R/2, c=C/2;
          el.className="qcell";
          const g=goalClassFor(r,c);
          if(g){ el.classList.add(g[0]); el.style.setProperty("--gtint",g[1]); }
          const pi=occupant(r,c);
          if(pi>=0) el.innerHTML=tokenHTML(players[pi].insect, pi===turn&&!gameOver);
          if(lastPawn===r+","+c) el.classList.add("qlast");
          if(isInteractive() && legalSet.has(r+","+c)){
            el.classList.add("qmove"); el.tabIndex=0; el.setAttribute("role","button"); el.setAttribute("aria-label","여기로 이동");
            el.addEventListener("click",()=>doMove(r,c));
            el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();doMove(r,c);}});
          }
        } else if(evenR&&!evenC){
          el.className="qgv"; // vertical gutter
          const cellRow=R/2, postCol=(C-1)/2;
          attachWall(el,"V",Math.min(cellRow,7),postCol);
        } else if(!evenR&&evenC){
          el.className="qgh"; // horizontal gutter
          const postRow=(R-1)/2, cellCol=C/2;
          attachWall(el,"H",postRow,Math.min(cellCol,7));
        } else {
          el.className="qpost";
        }
        boardEl.appendChild(el);
      }
    }
    H.forEach(k=>{const [r,c]=k.split(",").map(Number);const w=wallEl("H",r,c,false); if(lastWall&&lastWall.o==="H"&&lastWall.r===r&&lastWall.c===c) w.classList.add("wall-last"); boardEl.appendChild(w);});
    V.forEach(k=>{const [r,c]=k.split(",").map(Number);const w=wallEl("V",r,c,false); if(lastWall&&lastWall.o==="V"&&lastWall.r===r&&lastWall.c===c) w.classList.add("wall-last"); boardEl.appendChild(w);});
    if(pendingWall){ const w=wallEl(pendingWall.o,pendingWall.r,pendingWall.c,true,true); w.classList.add("sel"); boardEl.appendChild(w); }
  }

  function attachWall(el,o,r,c){
    if(!isInteractive() || players[turn].walls<=0) return;
    el.classList.add("qgut-active");
    el.addEventListener("click",()=>selectWall(o,r,c));
  }

  function wallEl(o,r,c,preview,valid){
    const w=document.createElement("div");
    w.className="qwall "+(o==="H"?"h":"v")+(preview?(" preview "+(valid?"ok":"bad")):"");
    const pad=5, inner=(boardEl.clientWidth||460)-2*pad;
    const cell=inner/12.52, gut=cell*0.44;                 // 9 cells + 8 gutters(0.44 each)
    const X=cc=>pad+cc*(cell+gut), Y=rr=>pad+rr*(cell+gut);
    if(o==="H"){ w.style.left=X(c)+"px"; w.style.top=(Y(r)+cell)+"px"; w.style.width=(2*cell+gut)+"px"; w.style.height=gut+"px"; }
    else       { w.style.left=(X(c)+cell)+"px"; w.style.top=Y(r)+"px"; w.style.width=gut+"px"; w.style.height=(2*cell+gut)+"px"; }
    return w;
  }
  function showPreview(o,r,c){ clearPreview(); const w=wallEl(o,r,c,true,canPlaceWall(o,r,c)); w.id="qprev"; boardEl.appendChild(w); }
  function clearPreview(){ const p=document.getElementById("qprev"); if(p) p.remove(); }

  function renderLegend(){
    legendEl.innerHTML="";
    players.forEach(p=>{ const s=document.createElement("span"); s.innerHTML=tokenHTML(p.insect,false)+`${p.name} → ${p.dir} 끝`; legendEl.appendChild(s); });
    const s=document.createElement("span"); s.innerHTML="🪵 울타리로 길을 막아요"; legendEl.appendChild(s);
  }

  function setMsg(t,kind){ msgEl.innerHTML=t; msgEl.className="message"+(kind?(" "+kind):""); }

  // ---- actions ----
  function doMove(r,c){
    if(!isInteractive()||!legalSet.has(r+","+c)) return;
    pushHist(); pendingWall=null;
    const p=players[turn]; p.r=r; p.c=c; lastPawn=r+","+c; lastWall=null;
    afterAction(turn, `<b>${p.name}</b>가 한 칸 나아갔어요!`);
  }
  function selectWall(o,r,c){
    if(!isInteractive()) return;
    const p=players[turn];
    if(p.walls<=0){ setMsg("울타리를 모두 썼어요. 말을 옮겨보세요.","warn"); return; }
    if(!canPlaceWall(o,r,c)){
      pendingWall=null; render();
      setMsg("여기엔 울타리를 세울 수 없어요. (겹치거나, 길을 완전히 막게 돼요)","warn");
      return;
    }
    pendingWall={o,r,c}; render();
    setMsg("여기에 울타리를 세울까요? <b>‘울타리 확정’</b>을 누르세요.","good");
  }
  function confirmWall(){
    if(!pendingWall||!isInteractive()) return;
    const p=players[turn], {o,r,c}=pendingWall;
    if(!canPlaceWall(o,r,c)){ pendingWall=null; render(); setMsg("여기엔 세울 수 없어요.","warn"); return; }
    pushHist(); (o==="H"?H:V).add(r+","+c); p.walls--; pendingWall=null; lastWall={o,r,c}; lastPawn=null;
    afterAction(turn, `<b>${p.name}</b>가 울타리를 세웠어요! (남은 ${p.walls}개)`);
  }
  function cancelWall(){ pendingWall=null; render(); setMsg("울타리를 취소했어요.","good"); }
  function renderWallbar(){
    const bar=document.getElementById("wallbar"); if(!bar) return;
    bar.innerHTML="";
    if(pendingWall && isInteractive()){
      const ok=document.createElement("button"); ok.className="btn mini"; ok.textContent="✓ 울타리 확정";
      ok.addEventListener("click",confirmWall);
      const no=document.createElement("button"); no.className="btn mini warn"; no.textContent="✕ 취소";
      no.addEventListener("click",cancelWall);
      bar.appendChild(ok); bar.appendChild(no);
    }
  }

  function afterAction(i, msg){
    const p=players[i];
    if(goalPred(p)(p.r,p.c)){ render(); win(i); return; }
    turn=(turn+1)%players.length;
    render();
    if(msg) setMsg(msg,"good");
    // mark the moved pawn with a hop
    const t=[...boardEl.querySelectorAll(".qcell .tok")];
    // (visual hop handled by re-render pulse; keep simple)
    if(players[turn].cpu){ cpuThinking=true; setMsg("🤖 컴퓨터가 생각하고 있어요…"); setTimeout(aiTurn, REDUCE?60:620); }
  }

  function win(i){
    gameOver=true; cpuThinking=false; winnerIdx=i;
    const p=players[i];
    render();
    mTok.innerHTML=tokenHTML(p.insect,false);
    mTitle.textContent=`${p.name} 승리! 🎉`;
    mText.textContent = p.cpu ? "컴퓨터가 먼저 도착했어요. 다시 도전해 볼까요?" : `${p.name}가 반대편 끝에 먼저 도착했어요!`;
    setMsg(`🎉 <b>${p.name}</b>가 이겼어요!`,"good");
    celebrate(INSECT[p.insect].color);
    overlay.classList.add("show");
  }

  // ---- AI (2-player, players[1]) ----
  function aiTurn(){
    if(gameOver){ cpuThinking=false; return; }
    if(!players[turn]||!players[turn].cpu){ cpuThinking=false; return; }
    pushHist();
    const me=players[1], opp=players[0];
    const myNow=bfs(me.r,me.c,goalPred(me));
    const oppNow=bfs(opp.r,opp.c,goalPred(opp));
    let bestWall=null;
    if(me.walls>0){
      for(const o of ["H","V"]) for(let r=0;r<8;r++) for(let c=0;c<8;c++){
        if(!canPlaceWall(o,r,c)) continue;
        const set=o==="H"?H:V; set.add(r+","+c);
        const nOpp=bfs(opp.r,opp.c,goalPred(opp)).dist;
        const nMe=bfs(me.r,me.c,goalPred(me)).dist;
        set.delete(r+","+c);
        if(nOpp===Infinity||nMe===Infinity) continue;
        const gain=(nOpp-oppNow.dist)-Math.max(0,nMe-myNow.dist);
        if(nOpp>oppNow.dist && (!bestWall||gain>bestWall.gain)) bestWall={o,r,c,gain};
      }
    }
    // pick best legal move (respects jumps)
    const moves=legalMoves(1);
    let bestMove=null,bmd=Infinity;
    for(const m of moves){ const d=bfs(m.r,m.c,goalPred(me)).dist; if(d<bmd){bmd=d;bestMove=m;} }
    // easy sometimes wanders (suboptimal move)
    let chosenMove=bestMove;
    if(diff==="easy" && moves.length && Math.random()<0.4){ chosenMove=moves[(Math.random()*moves.length)|0]; }

    // difficulty decides whether to use a wall
    const wallOK = bestWall && bestWall.gain>=1;
    let doWall=false;
    if(diff==="easy"){ doWall = wallOK && oppNow.dist<=2 && Math.random()<0.45; }
    else if(diff==="hard"){ doWall = wallOK && (oppNow.dist<=myNow.dist+1 || oppNow.dist<=3); }
    else { doWall = wallOK && oppNow.dist<=myNow.dist; }

    let acted=false;
    if(doWall){
      (bestWall.o==="H"?H:V).add(bestWall.r+","+bestWall.c); me.walls--;
      cpuThinking=false;
      afterAction(1, `🤖 컴퓨터가 울타리를 세웠어요! (남은 ${me.walls}개)`);
      acted=true;
    }
    if(!acted && chosenMove){
      me.r=chosenMove.r; me.c=chosenMove.c;
      cpuThinking=false;
      afterAction(1, "🤖 컴퓨터가 한 칸 나아갔어요.");
      acted=true;
    }
    if(!acted){ cpuThinking=false; afterAction(1, "🤖 컴퓨터가 지나갔어요."); }
  }

  // ---- celebration ----
  function celebrate(color){
    if(REDUCE) return;
    const palette=[color,"#ffce6b","#fff","#4e8636"];
    for(let i=0;i<70;i++){
      const s=document.createElement("div"); s.className="confetti";
      s.style.left=Math.random()*100+"vw"; s.style.top="-20px";
      s.style.background=palette[i%palette.length];
      s.style.transform=`rotate(${Math.random()*360}deg)`;
      fx.appendChild(s);
      const dx=(Math.random()*2-1)*120, dur=1600+Math.random()*1400, delayms=Math.random()*400;
      s.animate([{transform:s.style.transform,top:"-20px",opacity:1},
                 {top:"105vh",left:`calc(${s.style.left} + ${dx}px)`,opacity:.9,transform:`rotate(${Math.random()*720}deg)`}],
                {duration:dur,delay:delayms,easing:"cubic-bezier(.3,.5,.5,1)"}).onfinish=()=>s.remove();
    }
  }

  // ---- wiring ----
  modeSeg.addEventListener("click",e=>{

  });

  resetBtn.addEventListener("click",newGame);
  var _ub=document.getElementById("undoBtn"); if(_ub) _ub.addEventListener("click",undo);
  mBtn.addEventListener("click",function(){document.querySelector(".overlay").classList.remove("show");});
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("show");});

  boardEl.addEventListener("contextmenu",function(e){e.preventDefault();});
  newGame();
})();

<div class="rulesOverlay" id="rulesOverlay" role="dialog" aria-label="게임 규칙">
  <div class="rulesSheet">
    <h3>🐝 곤충 하이브 — 규칙</h3>
    <h4>목표</h4>
    <ul><li>상대의 <b>여왕벌(🐝)</b>을 <b>여섯 방향 모두</b> 곤충으로 둘러싸면 승리!</li></ul>
    <h4>내 차례 (놓기 또는 옮기기 중 하나)</h4>
    <ul><li><b>새 곤충 놓기:</b> 아래 내 곤충을 골라 빈 자리에 놓아요. 새로 놓는 곤충은 <b>내 곤충과는 붙고 상대 곤충과는 닿지 않게</b> 놓아야 해요(맨 처음 두 개는 예외).</li>
    <li><b>곤충 옮기기:</b> 판 위 내 곤충을 골라 이동해요. <b>단, 여왕벌을 먼저 놓아야</b> 다른 곤충을 옮길 수 있어요.</li></ul>
    <h4>여왕벌 규칙</h4>
    <ul><li>늦어도 <b>내 4번째 차례</b>까지는 여왕벌을 놓아야 해요.</li></ul>
    <h4>한 덩어리 규칙</h4>
    <ul><li>모든 곤충은 <b>항상 한 덩어리로 이어져</b> 있어야 해요. 옮기는 도중에도 무리가 끊기면 안 돼요(끊기게 하는 곤충은 못 움직여요).</li></ul>
    <h4>곤충별 움직임</h4>
    <ul><li><b>여왕벌 🐝:</b> 옆으로 <b>한 칸</b> 미끄러져 이동.</li>
    <li><b>딱정벌레 🪲:</b> 옆으로 한 칸 이동하거나 <b>다른 곤충 위로 올라탈</b> 수 있어요(올라탄 칸을 차지, 어부바!).</li>
    <li><b>거미 🕷️:</b> 무리 바깥을 따라 <b>정확히 세 칸</b> 이동(왔던 길 되돌아가기 없음).</li>
    <li><b>메뚜기 🦗:</b> 한 줄로 이어진 곤충들을 <b>뛰어넘어</b> 바로 다음 빈 칸에 착지.</li>
    <li><b>나비 🦋:</b> 무리 바깥을 따라 <b>원하는 만큼</b> 이동.</li></ul>
    <h4>미끄러지기</h4>
    <ul><li>양옆이 다 막힌 좁은 틈으로는 지나갈 수 없어요(메뚜기는 예외로 뛰어넘어요).</li></ul>
    <div class="tapclose">설명서를 누르면 닫혀요</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ---- hex helpers (axial q,r ; flat-top) ----
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  const key=(q,r)=>q+","+r;
  const parse=k=>k.split(",").map(Number);
  function neighbors(q,r){ return DIRS.map(([dq,dr])=>[q+dq,r+dr]); }
  // two common neighbors of adjacent A,B
  function gates(aq,ar,bq,br){
    const res=[];
    for(const [dq,dr] of DIRS){ const nq=aq+dq,nr=ar+dr;
      if(nq===bq&&nr===br) continue;
      // is (nq,nr) also adjacent to B?
      if(DIRS.some(([eq,er])=>bq+eq===nq&&br+er===nr)) res.push([nq,nr]);
    }
    return res; // length 2
  }

  const TYPES={
    queen:{emoji:"🐝",name:"여왕벌",count:1},
    spider:{emoji:"🕷️",name:"거미",count:2},
    beetle:{emoji:"🪲",name:"딱정벌레",count:2},
    hopper:{emoji:"🦗",name:"메뚜기",count:3},
    ant:{emoji:"🦋",name:"나비",count:3},
  };
  const ORDER=["queen","beetle","spider","hopper","ant"];
  const DESC={queen:"여왕벌 🐝 — 옆으로 한 칸 미끄러져 이동",beetle:"딱정벌레 🪲 — 옆으로 한 칸, 다른 곤충 위로 올라타기(어부바!)",spider:"거미 🕷️ — 무리 바깥을 따라 정확히 3칸",hopper:"메뚜기 🦗 — 한 줄로 이어진 곤충들을 뛰어넘어 착지",ant:"나비 🦋 — 무리 바깥을 따라 원하는 만큼"};

  // ---- state ----
  let cells;          // Map key -> array (stack) of {p,type}
  let hands;          // [ {type:count}, {type:count} ]
  let placedCount;    // pieces placed per player
  let queenPlaced;    // [bool,bool]
  let turn;           // 0 or 1
  let sel;            // {kind:'hand',type} or {kind:'board',q,r} or null
  let targets;        // array of {q,r} legal destinations
  let gameOver;
  let mode="cpu", thinking=false, diff="normal";
  let hist=[];
  let lastKey=null, winnerP=-1;

  const boardEl=document.getElementById("board");
  const bw=document.querySelector(".boardwrap");
  const hand1El=document.getElementById("hand1");
  const hand2El=document.getElementById("hand2");
  const turnbar=document.getElementById("turnbar");
  const msgEl=document.getElementById("message");
  const overlay=document.getElementById("overlay");
  const mTitle=document.getElementById("mTitle"), mText=document.getElementById("mText"), mIcon=document.getElementById("mIcon");
  const REDUCE=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function occ(q,r){ const s=cells.get(key(q,r)); return s&&s.length>0; }
  function top(q,r){ const s=cells.get(key(q,r)); return s&&s.length? s[s.length-1]:null; }
  function height(q,r){ const s=cells.get(key(q,r)); return s?s.length:0; }
  function occupiedKeys(){ const a=[]; for(const [k,s] of cells) if(s.length) a.push(k); return a; }

  function snap(){ return JSON.stringify({cells:[...cells].map(([k,st])=>[k,st.map(x=>({p:x.p,type:x.type}))]),hands:hands.map(o=>Object.assign({},o)),placedCount:placedCount.slice(),queenPlaced:queenPlaced.slice(),turn:turn,gameOver:gameOver,winnerP:winnerP,lastKey:lastKey}); }
  function pushHist(){ hist.push(snap()); if(hist.length>80) hist.shift(); }
  function restoreSnap(s){ const o=JSON.parse(s); cells=new Map(o.cells); hands=o.hands; placedCount=o.placedCount; queenPlaced=o.queenPlaced; turn=o.turn; gameOver=o.gameOver; winnerP=o.winnerP; lastKey=o.lastKey; }
  function undo(){
    if(!hist.length){ setMsg("무를 수가 없어요.","warn"); return; }
    restoreSnap(hist.pop());
    if(mode==="cpu"){ let g=0; while(hist.length && turn===1 && g++<6) restoreSnap(hist.pop()); }
    sel=null; targets=[]; thinking=false; document.querySelector(".overlay").classList.remove("show");
    render(); setMsg("한 수 물렀어요. 다시 두세요.","good");
  }
  function newGame(){
    cells=new Map(); hands=[{},{}]; placedCount=[0,0]; queenPlaced=[false,false];
    for(let p=0;p<2;p++) for(const t in TYPES) hands[p][t]=TYPES[t].count;
    turn=0; sel=null; targets=[]; gameOver=false; thinking=false; lastKey=null; winnerP=-1;
    overlay.classList.remove("show");
    render(); setMsg((mode==="cpu"?"노랑(나) 차례!":"노랑 차례!")+" 아래에서 곤충을 골라 판에 놓으세요.","good");
  }

  // ---- connectivity (one-hive) over ground cells ----
  function isConnectedWithout(exQ,exR){
    const occK=occupiedKeys().filter(k=>{ const [q,r]=parse(k); return !(q===exQ&&r===exR); });
    if(occK.length<=1) return true;
    const set=new Set(occK); const start=occK[0]; const seen=new Set([start]); const st=[start];
    while(st.length){ const [q,r]=parse(st.pop());
      for(const [nq,nr] of neighbors(q,r)){ const nk=key(nq,nr); if(set.has(nk)&&!seen.has(nk)){seen.add(nk);st.push(nk);} }
    }
    return seen.size===set.size;
  }
  // can we lift the top piece at (q,r)? (if height>1 -> yes; else must not disconnect)
  function canLift(q,r){ if(height(q,r)>1) return true; return isConnectedWithout(q,r); }

  // slide gate rule for ground movement between adjacent A->B (B empty, ignoring the moving piece already lifted)
  function canSlide(aq,ar,bq,br){
    const g=gates(aq,ar,bq,br);
    const o0=occ(g[0][0],g[0][1]), o1=occ(g[1][0],g[1][1]);
    return o0!==o1; // exactly one gate occupied: gap open + stays attached
  }
  function adjToHive(q,r, ignoreQ,ignoreR){
    for(const [nq,nr] of neighbors(q,r)){ if(occ(nq,nr) && !(nq===ignoreQ&&nr===ignoreR)) return true; }
    return false;
  }

  // ---- move generation (piece already conceptually lifted from origin) ----
  function withLifted(q,r,fn){
    const k=key(q,r); const s=cells.get(k); const piece=s.pop(); const emptied=s.length===0;
    if(emptied) cells.delete(k);
    let res;
    try{ res=fn(); } finally { if(emptied) cells.set(k,[]); cells.get(k).push(piece); }
    return res;
  }

  function queenMoves(q,r){ const out=[];
    for(const [nq,nr] of neighbors(q,r)){ if(!occ(nq,nr) && canSlide(q,r,nq,nr) && adjToHive(nq,nr,q,r)) out.push([nq,nr]); }
    return out;
  }
  function beetleMoves(q,r,fromHeight){
    // beetle: 1 step onto empty (slide) OR climb on top of an occupied neighbor
    const out=[];
    for(const [nq,nr] of neighbors(q,r)){
      const onto=occ(nq,nr), originOnTop=fromHeight>0;
      const ok = (onto||originOnTop) ? true : canSlide(q,r,nq,nr);
      if(ok && (onto || adjToHive(nq,nr,q,r))) out.push([nq,nr]);
    }
    return out;
  }
  function antMoves(q,r){
    const res=new Set(); const startK=key(q,r);
    const st=[[q,r]]; const seen=new Set([startK]);
    while(st.length){ const [cq,cr]=st.pop();
      for(const [nq,nr] of neighbors(cq,cr)){
        const nk=key(nq,nr);
        if(occ(nq,nr)||seen.has(nk)) continue;
        if(!canSlide(cq,cr,nq,nr)) continue;
        if(!adjToHive(nq,nr,q,r)) continue;
        seen.add(nk); res.add(nk); st.push([nq,nr]);
      }
    }
    res.delete(startK);
    return [...res].map(parse);
  }
  function spiderMoves(q,r){
    const dest=new Set(); const startK=key(q,r);
    function dfs(cq,cr,depth,path){
      if(depth===3){ dest.add(key(cq,cr)); return; }
      for(const [nq,nr] of neighbors(cq,cr)){
        const nk=key(nq,nr);
        if(occ(nq,nr)||path.has(nk)) continue;
        if(!canSlide(cq,cr,nq,nr)) continue;
        if(!adjToHive(nq,nr,q,r)) continue;
        path.add(nk); dfs(nq,nr,depth+1,path); path.delete(nk);
      }
    }
    dfs(q,r,0,new Set([startK]));
    dest.delete(startK);
    return [...dest].map(parse);
  }
  function hopperMoves(q,r){
    const out=[];
    for(const [dq,dr] of DIRS){
      let nq=q+dq,nr=r+dr;
      if(!occ(nq,nr)) continue;             // must jump over at least one
      let _g=0; while(occ(nq,nr)){ nq+=dq; nr+=dr; if(++_g>60) break; }  // continue over contiguous pieces
      out.push([nq,nr]);                     // first empty
    }
    return out;
  }

  function movesFor(q,r){
    const t=top(q,r); if(!t) return [];
    const h=height(q,r);
    if(t.type==="beetle"){
      // beetle may be on top(h>1) or ground(h==1)
      return withLifted(q,r, ()=> beetleMoves(q,r, h-1) );
    }
    // non-beetle can't move if covered (it's top by definition here) — proceed
    return withLifted(q,r, ()=>{
      switch(t.type){
        case "queen": return queenMoves(q,r);
        case "ant": return antMoves(q,r);
        case "spider": return spiderMoves(q,r);
        case "hopper": return hopperMoves(q,r);
        default: return [];
      }
    });
  }

  // ---- placement generation ----
  function placementTargets(player){
    const occK=occupiedKeys();
    if(occK.length===0) return [[0,0]];
    if(occK.length===1){ const [q,r]=parse(occK[0]); return neighbors(q,r).filter(([nq,nr])=>!occ(nq,nr)); }
    // empty cells adjacent to friendly, not adjacent to enemy
    const cand=new Set();
    for(const k of occK){ const [q,r]=parse(k);
      for(const [nq,nr] of neighbors(q,r)) if(!occ(nq,nr)) cand.add(key(nq,nr));
    }
    const out=[];
    for(const ck of cand){ const [q,r]=parse(ck);
      let touchF=false,touchE=false;
      for(const [nq,nr] of neighbors(q,r)){ const tp=top(nq,nr); if(!tp) continue; if(tp.p===player) touchF=true; else touchE=true; }
      if(touchF&&!touchE) out.push([q,r]);
    }
    return out;
  }
  function mustPlaceQueen(player){
    // by the player's 4th placement: if placed 3 and queen not placed -> must place queen
    return !queenPlaced[player] && placedCount[player]>=3;
  }
  function handHasMovableTypes(player){ return Object.keys(hands[player]).some(t=>hands[player][t]>0); }

  // ---- interaction ----
  function selectHand(type){
    if(gameOver||thinking||(mode==='cpu'&&turn===1)) return;
    const p=turn;
    if(hands[p][type]<=0) return;
    if(mustPlaceQueen(p) && type!=="queen"){ setMsg("이번 차례엔 <b>여왕벌</b>을 놓아야 해요!","warn"); return; }
    sel={kind:"hand",type};
    targets=placementTargets(p);
    if(targets.length===0){ setMsg("놓을 수 있는 자리가 없어요. 다른 곤충이나 이동을 해보세요.","warn"); sel=null; }
    else setMsg(DESC[type]+" · 빈 자리를 눌러 놓으세요.","good");
    render();
  }
  function selectBoard(q,r){
    if(gameOver||thinking||(mode==='cpu'&&turn===1)) return;
    const p=turn; const t=top(q,r);
    if(!t) return;
    // clicking ANY insect explains how it moves (educational)
    if(t.p!==p){ sel=null; targets=[]; render(); setMsg(DESC[t.type]+" (상대 곤충이에요)","warn"); return; }
    if(!queenPlaced[p]){ sel=null; targets=[]; render(); setMsg(DESC[t.type]+" — 먼저 <b>여왕벌</b>을 놓아야 옮길 수 있어요.","warn"); return; }
    if(!canLift(q,r)){ sel=null; targets=[]; render(); setMsg(DESC[t.type]+" — 지금 옮기면 무리가 끊겨요. (한 덩어리 규칙)","warn"); return; }
    sel={kind:"board",q,r};
    targets=movesFor(q,r);
    if(targets.length===0){ setMsg(DESC[t.type]+" — 지금은 갈 곳이 없어요.","warn"); sel=null; }
    else setMsg(DESC[t.type],"good");
    render();
  }
  function doPlace(q,r){
    pushHist();
    const p=turn, type=sel.type;
    const k=key(q,r); if(!cells.has(k)) cells.set(k,[]);
    cells.get(k).push({p,type});
    hands[p][type]--; placedCount[p]++;
    if(type==="queen") queenPlaced[p]=true;
    lastKey=key(q,r); endTurn();
  }
  function doMove(q,r){
    pushHist();
    const {q:fq,r:fr}=sel; const k0=key(fq,fr); const s=cells.get(k0); const piece=s.pop();
    if(s.length===0) cells.delete(k0);
    const k=key(q,r); if(!cells.has(k)) cells.set(k,[]); cells.get(k).push(piece);
    lastKey=k; endTurn();
  }
  function onTargetTap(q,r){
    if(!sel||thinking||(mode==='cpu'&&turn===1)) return;
    if(sel.kind==="hand") doPlace(q,r); else doMove(q,r);
  }

  function surrounded(player){
    // find player's queen; check all 6 neighbors occupied
    for(const [k,s] of cells){ for(const pc of s){ if(pc.type==="queen"&&pc.p===player){ const [q,r]=parse(k);
      return neighbors(q,r).every(([nq,nr])=>occ(nq,nr)); } } }
    return false;
  }
  function endTurn(){
    sel=null; targets=[];
    // win check (either queen surrounded)
    const s0=surrounded(0), s1=surrounded(1);
    if(s0||s1){ render(); return finish(s0&&s1? -1 : (s1?0:1)); }
    turn^=1;
    // if current player has no move and no placement, skip
    render();
    const nm = playerHasAnyAction(turn);
    if(!nm){ setMsg(`${pname(turn)}가 둘 곳이 없어 차례를 넘겨요.`,"warn"); turn^=1; render();
      if(!playerHasAnyAction(turn)){ return finish(-1); } }
    setMsg(`${pname(turn)} 차례!`,"good");
    maybeAI();
  }
  function playerHasAnyAction(p){
    // any placement?
    if(handHasMovableTypes(p)){ if(!(mustPlaceQueen(p)) || hands[p].queen>0){ if(placementTargets(p).length>0) return true; } }
    // any move? (only if queen placed)
    if(queenPlaced[p]){
      for(const [k,s] of [...cells]){ const t=s[s.length-1]; if(t&&t.p===p){ const [q,r]=parse(k); if(canLift(q,r)&&movesFor(q,r).length>0) return true; } }
    }
    return false;
  }
  // ---- AI (player 1) ----
  function aiCandidates(p){
    const acts=[]; const mustQ=mustPlaceQueen(p); const tps=placementTargets(p);
    for(const type of ORDER){ if(hands[p][type]<=0) continue; if(mustQ&&type!=="queen") continue;
      for(const [q,r] of tps) acts.push({kind:"place",type,q,r}); }
    if(queenPlaced[p] && !mustQ){
      for(const [k,s] of [...cells]){ const t=s[s.length-1]; if(t&&t.p===p){ const [q,r]=parse(k);
        if(!canLift(q,r)) continue; for(const [tq,tr] of movesFor(q,r)) acts.push({kind:"move",fq:q,fr:r,tq,tr,type:t.type}); } }
    }
    return acts;
  }
  function applyAction(a){
    if(a.kind==="place"){ const k=key(a.q,a.r); const created=!cells.has(k); if(created)cells.set(k,[]); cells.get(k).push({p:1,type:a.type});
      hands[1][a.type]--; placedCount[1]++; const wasQ=queenPlaced[1]; if(a.type==="queen")queenPlaced[1]=true; a._u={created,k,wasQ}; }
    else { const k0=key(a.fq,a.fr); const s=cells.get(k0); const pc=s.pop(); const emptied=s.length===0; if(emptied)cells.delete(k0);
      const k=key(a.tq,a.tr); const created=!cells.has(k); if(created)cells.set(k,[]); cells.get(k).push(pc); a._u={k0,emptied,pc,k,created}; }
  }
  function undoAction(a){
    if(a.kind==="place"){ const {created,k,wasQ}=a._u; cells.get(k).pop(); if(created||cells.get(k).length===0)cells.delete(k);
      hands[1][a.type]++; placedCount[1]--; queenPlaced[1]=wasQ; }
    else { const {k0,pc,k,created}=a._u; const sd=cells.get(k); sd.pop(); if(created||sd.length===0)cells.delete(k);
      if(!cells.has(k0))cells.set(k0,[]); cells.get(k0).push(pc); }
  }
  function findQueen(pl){ for(const [k,s] of cells){ for(const pc of s){ if(pc.type==="queen"&&pc.p===pl) return parse(k); } } return null; }
  function evalFor(ai,aggro){
    aggro=aggro||1;
    const oq=findQueen(ai^1), aq=findQueen(ai);
    const occN=qr=> qr? neighbors(qr[0],qr[1]).filter(([nq,nr])=>occ(nq,nr)).length : 0;
    const oS=occN(oq), aS=occN(aq);
    if(oq&&oS===6) return 1e6;

    let sc=62*aggro*oS-56*aS;
    if(oq){ for(const [nq,nr] of neighbors(oq[0],oq[1])){ const t=top(nq,nr); if(t&&t.p===ai) sc+=6; } }
    if(!queenPlaced[ai]) sc-=18;

  function performAction(a){
    pushHist();

      hands[1][a.type]--; placedCount[1]++; if(a.type==="queen")queenPlaced[1]=true; lastKey=k; }
    else { const k0=key(a.fq,a.fr); const s=cells.get(k0); const pc=s.pop(); if(!s.length)cells.delete(k0);

  function aiMove(){

      if(diff==="easy"){ performAction(acts[(Math.random()*acts.length)|0]); return; }

  }

  // ---- rendering ----
  function layout(){
    // gather cells to show: occupied + (targets) + margin
    const pts=[];
    for(const k of occupiedKeys()){ const [q,r]=parse(k); pts.push([q,r]); }
    targets.forEach(([q,r])=>pts.push([q,r]));

    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    const px=(q,r)=>[1.5*q, Math.sqrt(3)*(r+q/2)];

    });
  }

<div class="rulesOverlay" id="rulesOverlay" role="dialog" aria-label="게임 규칙">
  <div class="rulesSheet">
    <h3>🦋 곤충 저르츠 — 규칙</h3>
    <h4>목표 (셋 중 하나 모으면 승리)</h4>
    <ul><li>흰나비 🦋 <b>4마리</b>, 또는 꿀벌 🐝 <b>5마리</b>, 또는 딱정벌레 🪲 <b>6마리</b>,</li>
    <li>또는 <b>세 종류를 각각 3마리씩</b> 모으면 승리!</li></ul>
    <h4>내 차례 — ① 놓기</h4>
    <ul><li>공용 통에서 곤충 하나를 골라 <b>빈 고리</b> 위에 올려요.</li>
    <li>그다음 <b>가장자리의 빈 고리 하나</b>를 떼어내요(뗄 수 있는 고리가 있으면 반드시). 고리는 <b>바깥쪽 두 방향이 뚫린</b> 빈 고리만 뗄 수 있어요.</li></ul>
    <h4>내 차례 — ② 뛰어넘기 (강제!)</h4>

    <li>곤충이 <b>바로 옆 곤충</b>을 <b>일직선으로 뛰어넘어</b> 그 너머 <b>빈 고리</b>에 착지하면, 넘은 곤충을 <b>잡아요.</b></li>
    <li>착지 후 또 넘을 수 있으면 <b>연속으로</b> 계속 넘어야 해요.</li></ul>
    <h4>고립 잡기</h4>

<script>
(function(){
  "use strict";
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  const CYC=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]]; // cyclic order around a hex
  const key=(q,r)=>q+","+r, parse=k=>k.split(",").map(Number);
  const COLORS=["w","g","b"];
  const GLYPH={w:"🦋",g:"🐝",b:"🪲"};
  const CNAME={w:"흰나비",g:"꿀벌",b:"딱정벌레"};
  const RAD=3; // hexagon radius 3 -> 37 rings

  // board cells (fixed hexagon)
  const ALLCELLS=[];
  for(let q=-RAD;q<=RAD;q++) for(let r=-RAD;r<=RAD;r++){ if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=RAD) ALLCELLS.push([q,r]); }

  let present, marble, supply, stock, turn, phase, selColor, capFrom, chaining, gameOver;
  let mode="cpu", diff="normal", OPPW=14;
  let lastCell=null, winnerP=-1;
  let hist=[], turnSnapped=false;

  const boardEl=document.getElementById("board");
  const bw=document.querySelector(".boardwrap");
  const supplyEl=document.getElementById("supply");
  const stocksEl=document.getElementById("stocks");
  const msgEl=document.getElementById("message");
  const overlay=document.getElementById("overlay");
  const mTitle=document.getElementById("mTitle"),mText=document.getElementById("mText"),mIcon=document.getElementById("mIcon");

  const isPresent=(q,r)=>present.has(key(q,r));
  const mat=(q,r)=>marble.get(key(q,r))||null;

  function newGame(){
    present=new Set(ALLCELLS.map(([q,r])=>key(q,r)));
    marble=new Map();
    supply={w:6,g:8,b:10};
    stock=[{w:0,g:0,b:0},{w:0,g:0,b:0}];
    turn=0; gameOver=false; selColor=null; capFrom=null; chaining=false; lastCell=null; winnerP=-1; hist=[]; turnSnapped=false;
    overlay.classList.remove("show");
    startTurn();
  }

  // ---- rules ----
  function capMovesFrom(q,r){ // requires marble at (q,r)
    const out=[];
    if(!mat(q,r)) return out;
    for(const [dq,dr] of DIRS){
      const bq=q+dq,br=r+dr, cq=q+2*dq,cr=r+2*dr;
      if(isPresent(bq,br) && mat(bq,br) && isPresent(cq,cr) && !mat(cq,cr)){
        out.push({over:[bq,br], to:[cq,cr]});
      }
    }
    return out;
  }
  function allJumpers(){ const list=[]; for(const k of present){ const [q,r]=parse(k); if(mat(q,r)&&capMovesFrom(q,r).length) list.push([q,r]); } return list; }

  function removableRings(){
    const out=[];
    for(const k of present){ const [q,r]=parse(k);
      if(mat(q,r)) continue; // must be empty
      const open=CYC.map(([dq,dr])=>!isPresent(q+dq,r+dr));
      let ok=false; for(let i=0;i<6;i++){ if(open[i]&&open[(i+1)%6]){ok=true;break;} }
      if(ok) out.push([q,r]);
    }
    return out;
  }
  function components(){
    const seen=new Set(), comps=[];
    for(const k of present){ if(seen.has(k)) continue;
      const comp=[k]; seen.add(k); const st=[k];
      while(st.length){ const [q,r]=parse(st.pop());
        for(const [dq,dr] of DIRS){ const nk=key(q+dq,r+dr); if(present.has(nk)&&!seen.has(nk)){seen.add(nk);comp.push(nk);st.push(nk);} }
      }
      comps.push(comp);
    }
    return comps;
  }
  function isolationCapture(){
    const comps=components();
    if(comps.length<=1) return 0;
    let captured=0;
    for(const comp of comps){
      if(comp.every(k=>{const [q,r]=parse(k);return mat(q,r);})){
        for(const k of comp){ const [q,r]=parse(k); const col=mat(q,r); stock[turn][col]++; captured++; marble.delete(k); present.delete(k); }
      }
    }
    return captured;
  }
  function winConditionMet(p){ const s=stock[p]; return s.w>=4||s.g>=5||s.b>=6||(s.w>=3&&s.g>=3&&s.b>=3); }

  // ---- turn flow ----
  function snapZ(){ return JSON.stringify({present:[...present],marble:[...marble],supply:supply,stock:stock,turn:turn,phase:phase,gameOver:gameOver,lastCell:lastCell,winnerP:winnerP}); }
  function pushZ(){ hist.push(snapZ()); if(hist.length>80) hist.shift(); }
  function restoreZ(s){ const o=JSON.parse(s); present=new Set(o.present); marble=new Map(o.marble); supply=o.supply; stock=o.stock; turn=o.turn; phase=o.phase; gameOver=o.gameOver; lastCell=o.lastCell; winnerP=o.winnerP; }
  function undoZ(){
    if(phase==="animremove") return;
    if(mode==="cpu"&&turn===1) return;
    if(!hist.length){ setMsg("무를 수가 없어요.","warn"); return; }
    restoreZ(hist.pop());
    if(mode==="cpu"){ let g=0; while(hist.length && turn===1 && g++<8) restoreZ(hist.pop()); }
    turnSnapped=false; selColor=null; capFrom=null; chaining=false;
    if(overlay) overlay.classList.remove("show"); render();
    setMsg("한 수 물렀어요.","good");
  }
  function startTurn(){
    turnSnapped=false;
    selColor=null; capFrom=null; chaining=false;
    if(allJumpers().length){ phase="capture";
      setMsg(`<b>${pname(turn)}</b> 차례 — 뛰어넘을 수 있어요! 곤충을 골라 뛰어넘으세요(강제).`,"cap");
    } else {
      const canPlace = ALLCELLS.some(([q,r])=>isPresent(q,r)&&!mat(q,r)) && COLORS.some(canUseColor);
      if(!canPlace){ return endByCount(); }
      phase="place";
      if(!COLORS.some(c=>supply[c]>0) && COLORS.some(c=>stock[turn][c]>0)){
        setMsg(`<b>${pname(turn)}</b> 차례 — 공용 통이 비어 내 곤충을 놓아요. 색을 고르고 빈 고리에 놓으세요.`,"good");
      } else {
        setMsg(`<b>${pname(turn)}</b> 차례 — 곤충 색을 고르고 빈 고리에 놓으세요.`,"good");
      }
    }
    render();
    if(mode==="cpu"&&turn===1&&!gameOver) setTimeout(aiTurn, 520);
  }
  function poolCount(c){ return supply[c]>0?supply[c]:0; }
  function canUseColor(c){ return supply[c]>0 || (!COLORS.some(x=>supply[x]>0) && stock[turn][c]>0); }

  function selectColor(c){
    if(gameOver||phase!=="place"||!canUseColor(c)) return;
    selColor=c; render();
  }
  function placeAt(q,r){
    if(phase!=="place"||!selColor||mat(q,r)||!isPresent(q,r)) return;
    if(!turnSnapped){ pushZ(); turnSnapped=true; }
    if(supply[selColor]>0) supply[selColor]--; else stock[turn][selColor]--; // fallback from own stock
    marble.set(key(q,r),selColor); lastCell=key(q,r);
    const rem=removableRings();
    if(rem.length){ phase="remove"; setMsg("좋아요! 이제 <b>뗄 수 있는 고리</b>(빨간 테두리) 하나를 떼어내세요.","good"); render(); }
    else { setMsg("놓았어요! 뗄 수 있는 고리가 없어 이번엔 고리를 안 떼요.","good"); endTurn(); }
  }
  function removeRing(q,r){
    if(phase!=="remove"||mat(q,r)||!isPresent(q,r)) return;
    if(!removableRings().some(([a,b])=>a===q&&b===r)) return;
    const finalize=()=>{ present.delete(key(q,r));
      const cap=isolationCapture();
      if(cap>0){ if(winConditionMet(turn)){ render(); return finish(turn); }
        setMsg(`고립된 곤충 ${cap}마리를 잡았어요!`,"cap"); }
      endTurn(); };
    const el=boardEl.querySelector('.cell[data-k="'+key(q,r)+'"]');
    if(el){ phase="animremove"; el.classList.add("removing"); setMsg("고리를 떼어내는 중…","good"); setTimeout(finalize,1050); }
    else finalize();
  }
  function selectJumper(q,r){
    if(phase!=="capture"||!mat(q,r)) return;
    if(chaining && !(capFrom&&capFrom[0]===q&&capFrom[1]===r)) return; // must continue with same marble
    if(!capMovesFrom(q,r).length) return;
    capFrom=[q,r]; render();
  }
  function doJump(cq,cr){
    if(phase!=="capture"||!capFrom) return;
    if(!turnSnapped){ pushZ(); turnSnapped=true; }
    const [q,r]=capFrom;
    const mv=capMovesFrom(q,r).find(m=>m.to[0]===cq&&m.to[1]===cr);
    if(!mv) return;
    const col=mat(key(q,r))||marble.get(key(q,r));
    const overCol=marble.get(key(mv.over[0],mv.over[1]));
    const overEl=boardEl.querySelector('.cell[data-k="'+key(mv.over[0],mv.over[1])+'"]');
    const overRect=overEl?overEl.getBoundingClientRect():null;
    marble.delete(key(mv.over[0],mv.over[1])); stock[turn][overCol]++;
    flyCapture(overRect, overCol, turn);
    marble.delete(key(q,r)); marble.set(key(cq,cr),col); lastCell=key(cq,cr);
    if(winConditionMet(turn)){ render(); return finish(turn); }
    // continue chain?
    if(capMovesFrom(cq,cr).length){ capFrom=[cq,cr]; chaining=true;
      setMsg("연속 포획! 계속 뛰어넘으세요.","cap"); render(); }
    else { endTurn(); }
  }
  function endTurn(){
    selColor=null; capFrom=null; chaining=false;
    if(gameOver) return;
    // both players out of moves? (no jumps and board empty of rings/marbles)
    turn^=1; startTurn();
  }
  const pname=p=> (mode==="cpu"&&p===1)?"주황 🤖":(p===0?"파랑":"주황");
  function finish(winner){
    gameOver=true; winnerP=winner;
    mIcon.textContent="🏆"; mTitle.textContent=`${pname(winner)} 승리! 🎉`;
    const s=stock[winner]; mText.textContent=`모은 곤충 — 🦋${s.w} 🐝${s.g} 🪲${s.b}`;
    setMsg(`🎉 ${pname(winner)} 승리!`,"good"); render(); overlay.classList.add("show");
  }
  function endByCount(){
    const tot=p=>stock[p].w+stock[p].g+stock[p].b; const a=tot(0),b=tot(1); gameOver=true;
    if(a===b){ mIcon.textContent="🤝"; mTitle.textContent="무승부!"; mText.textContent=`둘 다 ${a}마리를 모았어요`; setMsg("무승부!","good"); }
    else { const w=a>b?0:1; winnerP=w; mIcon.textContent="🏆"; mTitle.textContent=`${pname(w)} 승리! 🎉`;
      mText.textContent=`더 놓을 곳이 없어 개수로 승부! 합계 ${Math.max(a,b)} : ${Math.min(a,b)}`; setMsg(`🎉 ${pname(w)} 승리! (개수)`,"good"); }
    render(); overlay.classList.add("show");
  }

  // ---- AI (player 1) ----
  function capFromP(P,M,cur){ const [q,r]=parse(cur); const mv=[];
    for(const [dq,dr] of DIRS){ const b=key(q+dq,r+dr), c=key(q+2*dq,r+2*dr);
      if(P.has(b)&&M.get(b)&&P.has(c)&&!M.get(c)) mv.push({over:b,to:c,overCol:M.get(b)}); } return mv; }
  function bestChainCount(P,M,cur){ const mv=capFromP(P,M,cur); if(!mv.length) return 0; let best=0;
    for(const m of mv){ const M2=new Map(M); const col=M2.get(cur); M2.delete(cur); M2.delete(m.over); M2.set(m.to,col);
      best=Math.max(best,1+bestChainCount(P,M2,m.to)); } return best; }
  function bestOppCapture(P,M){ let best=0; for(const k of P){ if(M.get(k)){ const c=bestChainCount(P,M,k); if(c>best)best=c; } } return best; }
  function countIsoCap(P,M){ const seen=new Set(),comps=[];

  .tslot{position:relative;aspect-ratio:1/1;border-radius:10px;background:#fff;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;container-type:size;}
  .tray.giving .tslot.has{cursor:pointer;}
  .tray.giving .tslot.has:hover{border-color:var(--hl);box-shadow:0 0 0 2px rgba(78,134,54,.3);}
  .tslot.gone{opacity:.18;}

  .message{flex:0 0 auto;text-align:center;font-size:12.8px;background:#fff;border:2px solid var(--line);border-radius:11px;padding:6px 12px;min-height:0;line-height:1.4;}
  .message.good{border-color:var(--hl);color:#34611f;} .message.warn{border-color:#e08b3a;color:#c8721f;}
  .message b{color:#3e6a2c;}
  .actions{display:flex;gap:8px;justify-content:center;flex:0 0 auto;}
  .btn{font-family:"Jua";font-size:13px;border:none;border-radius:11px;padding:7px 15px;cursor:pointer;color:#fff;background:var(--hl);box-shadow:0 3px 0 var(--hl-soft);}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
  .btn:active{transform:translateY(2px);}

  .qseg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;}
  .qseg button{font-family:"Jua";font-size:12px;border:none;background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;}
  .qseg button.on{background:#4e8636;color:#fff;}
  .rulesFab{position:fixed;top:8px;right:8px;z-index:40;font-family:"Jua";font-size:12.5px;border:2px solid rgba(0,0,0,.14);cursor:pointer;background:#fff;color:#333;padding:6px 11px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);}
  .rulesOverlay{position:fixed;inset:0;background:rgba(20,25,20,.68);display:none;align-items:center;justify-content:center;z-index:96;padding:14px;cursor:pointer;}
  .rulesOverlay.show{display:flex;}
  .rulesSheet{background:#fff;width:100%;max-width:430px;max-height:90vh;overflow:auto;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);line-height:1.6;font-size:13.7px;color:#3a3a3a;text-align:left;}
  .rulesSheet h3{font-family:"Jua";font-weight:400;margin:0 0 8px;font-size:19px;color:#3e6a2c;}
  .rulesSheet h4{font-family:"Jua";font-weight:400;margin:12px 0 3px;font-size:14.5px;}
  .rulesSheet ul{margin:2px 0 0;padding-left:18px;} .rulesSheet li{margin:3px 0;} .rulesSheet b{color:#b5651d;}
  .rulesSheet .tapclose{text-align:center;margin-top:14px;font-size:12px;color:#aaa;}
  .overlay{position:fixed;inset:0;background:transparent;display:none;align-items:flex-start;justify-content:center;z-index:80;padding:6px;pointer-events:none;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border:3px solid var(--line);border-radius:16px;padding:11px 16px;text-align:center;pointer-events:auto;opacity:.97;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .modal h2{font-family:"Jua";font-weight:400;font-size:24px;margin:6px 0 8px;color:#3e6a2c;}
  .modal p{color:var(--muted);margin:0 0 16px;font-size:14px;}
  /* 작은 폰: 곤충 타일 6열×3행(더 크게) */
  @media (max-width:560px){
    .tray{grid-template-columns:repeat(6,1fr);gap:7px;width:min(92vw,50vh);max-width:96vw;margin:8px auto 0;}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
  /* --- win result: non-covering bottom banner so the final board stays visible --- */
  .overlay{background:rgba(28,22,10,.55) !important;align-items:center !important;justify-content:center !important;pointer-events:auto !important;padding:16px !important;}
  .overlay .modal,.modal{pointer-events:auto !important;max-width:94vw !important;padding:11px 18px !important;border-width:2px !important;box-shadow:0 8px 24px rgba(0,0,0,.35) !important;}
  .modal h2{font-size:20px !important;margin:2px 0 4px !important;}
  .modal p{margin:0 0 9px !important;font-size:12.5px !important;white-space:pre-line;}
  .modal>div:first-child{font-size:30px !important;}

  /* --- tutorial component --- */
  .tutFab{position:fixed;top:8px;left:8px;z-index:41;font-family:"Jua",sans-serif;font-size:12.5px;border:2px solid rgba(0,0,0,.14);cursor:pointer;background:#fff;color:#b5651d;padding:6px 11px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);}
  .tutOverlay{position:fixed;inset:0;background:rgba(30,22,10,.62);display:none;align-items:center;justify-content:center;z-index:120;padding:16px;}
  .tutOverlay.show{display:flex;}
  .tutCard{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:22px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.45);text-align:center;font-family:"Gowun Dodum",system-ui,sans-serif;}
  .tutEmoji{font-size:52px;line-height:1;margin-bottom:8px;}
  .tutText{font-size:16px;line-height:1.55;color:#3a3a3a;min-height:74px;display:flex;align-items:center;justify-content:center;}
  .tutText b{color:#b5651d;}
  .tutDots{display:flex;gap:6px;justify-content:center;margin:14px 0;}
  .tutDots span{width:8px;height:8px;border-radius:50%;background:#e2d8c4;transition:transform .15s;}
  .tutDots span.on{background:#b5651d;transform:scale(1.3);}
  .tutNav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .tutNav button{font-family:"Jua",sans-serif;font-size:14px;border:none;border-radius:11px;padding:9px 16px;cursor:pointer;}
  .tutNav #tutPrev{background:#f0e9da;color:#7a6b58;}
  .tutNav #tutNext{background:#b5651d;color:#fff;box-shadow:0 3px 0 #8a4a15;}
  .tutNav #tutClose{background:#fff;color:#9a9a9a;border:2px solid #e2d8c4;}
  .tutNav button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
</style>
<style id="btnboost">
  .btn{font-size:clamp(13px,3.3vw,18px)!important;padding:8px 13px!important;border-radius:12px!important;}
  .seg button{font-size:clamp(12px,3vw,15px)!important;padding:6px 11px!important;}
  .modal .btn{font-size:clamp(15px,4vw,19px)!important;padding:11px 20px!important;}

  header{display:none!important;}
  .tutFab,.rulesFab{display:none!important;}
  .wrap{gap:3px!important;}
  .segs{margin:0!important;}
  .segs .seg{padding:3px!important;}
  .segs .seg button{font-size:15px!important;padding:8px 15px!important;}
