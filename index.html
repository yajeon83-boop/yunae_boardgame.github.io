  const SETS={classic:LEVELS, kid:(typeof KIDLEVELS!=="undefined"?KIDLEVELS:LEVELS), sasq:(typeof SASQ!=="undefined"?SASQ:LEVELS)};

  let R,C,walls,goals,boxes,pr,pc;          // current stage state
  let startBoxes,startPr,startPc;           // stage start snapshot
  let boxType, startBoxType;                // per-box food-item type (0..4)
  let moves,gameOver,playing,hist,histDirs,token=0;
  let stage=0;                               // current level index 0..N-1
  let cleared=new Array(N).fill(false);      // which stages are solved
  let bestMoves=new Array(N).fill(0);        // fewest moves per stage (0 = not cleared)
  let lastLevel=0;                           // last opened stage
  let solMoves=[];

  const boardEl=document.getElementById("board");
  const statusEl=document.getElementById("status");
  const msgEl=document.getElementById("message");
  const overlay=document.getElementById("overlay");

  function setMsg(t,k){ msgEl.innerHTML=t; msgEl.className="message"+(k?(" "+k):""); }
  const inb=(r,c)=>r>=0&&r<R&&c>=0&&c<C;
  const isWall=(r,c)=>!inb(r,c)||walls[r][c];
  const key=(r,c)=>r+","+c;
  const isBox=(r,c)=>boxes.has(key(r,c));
  const isGoal=(r,c)=>goals.has(key(r,c));

  function loadPrefs(){
    try{ const o=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
      if(Array.isArray(o.cleared)) for(let i=0;i<N;i++) cleared[i]=!!o.cleared[i];
      if(Array.isArray(o.best)) for(let i=0;i<N;i++) bestMoves[i]=Math.max(0,parseInt(o.best[i])||0);
      if(typeof o.last==="number"&&o.last>=0&&o.last<N) lastLevel=o.last;
    }catch(e){}
  }
  function savePrefs(){
    try{ localStorage.setItem(PREF_KEY, JSON.stringify({cleared:cleared,best:bestMoves,last:lastLevel})); }catch(e){}
  }

  // ---- load a stage from XSB ----
  function loadStage(i){
    stage=Math.max(0,Math.min(N-1,i));
    const L=CUR[stage];
    const rows=L.x.split("\n");
    R=rows.length; C=rows[0].length;
    walls=Array.from({length:R},()=>Array(C).fill(false));
    goals=new Set(); boxes=new Set(); boxType=new Map(); pr=pc=0; let __bi=0, __ci=0;
    // each box gets its OWN color (sequential = all different within a stage, up to 12 boxes),
    // and a varied food shape. stage offset just shifts the starting color per stage.
    const nextMeta=()=>{ const t=(__bi*3+stage)%ITEMB.length; const c=(__ci++ + stage)%PAL.length; __bi++; return t*PAL.length+c; };
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const ch=rows[r][c];
      if(ch==="#") walls[r][c]=true;
      else if(ch===".") goals.add(key(r,c));
      else if(ch==="$"){ boxes.add(key(r,c)); boxType.set(key(r,c),nextMeta()); }
      else if(ch==="*"){ goals.add(key(r,c)); boxes.add(key(r,c)); boxType.set(key(r,c),nextMeta()); }
      else if(ch==="@") { pr=r; pc=c; }
      else if(ch==="+"){ goals.add(key(r,c)); pr=r; pc=c; }
    }
    solMoves=L.s.split("").map(ch=>CH2DIR[ch]);
    startBoxes=new Set(boxes); startBoxType=new Map(boxType); startPr=pr; startPc=pc;
    moves=0; gameOver=false; playing=false; hist=[]; histDirs=[];
    token++;
    savePrefs();
    render();
    setMsg(mode==="kid"?"곤충을 밀어 거미줄에 모두 걸어요! 🕷️":"먹이를 밀어 개미집에 모두 넣어요! 🐜","good");
  }

  // ---- rendering ----
  function sizeBoard(){
    const mid=document.querySelector(".mid"); if(!mid) return;
    let availW=mid.clientWidth||Math.floor(window.innerWidth*0.96);
    let availH=mid.clientHeight;
    if(!availH||availH<80){ const wrap=document.querySelector(".wrap");
      availH=((wrap&&wrap.clientHeight)||window.innerHeight)-260; }
    availW=Math.max(120,availW); availH=Math.max(140,availH);
    // fixed pixel padding + gap (percentages don't size grid rows reliably -> cells got squished)
    const base=Math.min(availW,availH);
    const PAD=Math.max(6, Math.round(base*0.018));
    const GAP=Math.max(2, Math.round(base*0.013));
    // largest square cell that fits BOTH width and height
    const cw=(availW - PAD*2 - (C-1)*GAP)/C;
    const ch=(availH - PAD*2 - (R-1)*GAP)/R;
    const cell=Math.max(10, Math.floor(Math.min(cw,ch)));
    const bw=cell*C + GAP*(C-1) + PAD*2;
    const bh=cell*R + GAP*(R-1) + PAD*2;
    boardEl.style.gridTemplateColumns="repeat("+C+","+cell+"px)";
    boardEl.style.gridTemplateRows="repeat("+R+","+cell+"px)";
    boardEl.style.gap=GAP+"px";
    boardEl.style.padding=PAD+"px";
    boardEl.style.width=Math.round(bw)+"px";
    boardEl.style.height=Math.round(bh)+"px";
  }
  function antNode(){
    const a=document.createElement("div"); a.className="ant";
    if(mode==="kid"){ a.classList.add("spider"); a.innerHTML=SPIDER; }
    else { a.textContent="🐜"; }
    return a;
  }
  function itemNode(meta, home){
    meta=meta||0;
    const e=document.createElement("div"); e.className="item"+(home?" delivered":"");
    if(mode==="kid"){ e.innerHTML=KIDBUGS[meta%KIDBUGS.length](); }
    else { const t=Math.floor(meta/PAL.length)%ITEMB.length, c=meta%PAL.length; e.innerHTML=ITEMB[t](PAL[c][0], PAL[c][1]); }
    return e;
  }
  function nestNode(){
    const n=document.createElement("div"); n.className="nest"; n.innerHTML=(mode==="kid")?WEB:NESTSVG; return n;
  }
  function onGoalCount(){ let n=0; boxes.forEach(k=>{ if(goals.has(k)) n++; }); return n; }

  function render(hintCell){
    statusEl.innerHTML='<span class="chip">👣 <b>'+moves+'</b> 수</span>'
      +'<span class="chip">🏠 <b>'+onGoalCount()+'</b> / '+boxes.size+'</span>';
    (function(){
      document.getElementById("posNum").textContent=(stage+1);
      document.getElementById("posTot").textContent=N;
      const bn=document.getElementById("bestNum");
      bn.textContent=bestMoves[stage]?(bestMoves[stage]+"수"):"–";
      document.getElementById("prevBtn").disabled=(stage<=0);
      document.getElementById("nextBtn").disabled=(stage>=N-1);
    })();
    sizeBoard();
    boardEl.innerHTML="";
    let firstCell=null;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const cell=document.createElement("div"); cell.className="cell";
      if(!firstCell) firstCell=cell;
      if(walls[r][c]) cell.classList.add("wall");
      if(isGoal(r,c)){ cell.classList.add("tgt"); cell.appendChild(nestNode()); }
      if(hintCell&&hintCell[0]===r&&hintCell[1]===c) cell.classList.add("hintdot");
      if(isBox(r,c)) cell.appendChild(itemNode(boxType.get(key(r,c)), isGoal(r,c)));
      if(r===pr&&c===pc) cell.appendChild(antNode());
      cell.addEventListener("click",()=>tapCell(r,c));
      boardEl.appendChild(cell);
    }
    if(firstCell){ const cw=firstCell.offsetWidth; if(cw) boardEl.style.fontSize=(cw*0.8)+"px"; }
  }

  // ---- moves (Sokoban step-push) ----
  function snapshot(){ hist.push({ b:Array.from(boxes), bt:Array.from(boxType.entries()), pr, pc, moves, hd:histDirs.length }); if(hist.length>400) hist.shift(); }

  function tryMove(di){ if(playing||gameOver) return;
    const [dy,dx]=DIRS[di]; const tr=pr+dy,tc=pc+dx;
    if(isWall(tr,tc)){ setMsg("벽이라 못 가요.","warn"); return; }
    if(isBox(tr,tc)){
      // 밀기: 먹이가 벽이나 다른 먹이에 막힐 때까지 쭉 밀기
      if(isWall(tr+dy,tc+dx)||isBox(tr+dy,tc+dx)){ setMsg("먹이를 더 밀 수 없어요.","warn"); return; }
      snapshot();
      let moved=0;
      while(true){
        const br=pr+dy, bc=pc+dx;        // 지금 개미 앞의 먹이 칸
        const nr=br+dy, nc=bc+dx;         // 먹이가 갈 칸
        if(!isBox(br,bc)) break;          // 앞에 먹이 없으면 끝
        if(isWall(nr,nc)||isBox(nr,nc)) break;  // 벽이나 다른 먹이 → 정지
        const k1=key(br,bc),k2=key(nr,nc),t=boxType.get(k1);
        boxes.delete(k1); boxes.add(k2); boxType.delete(k1); boxType.set(k2,t);
        pr=br; pc=bc; moves++; histDirs.push(di); moved++;
        if(isGoal(nr,nc)) break;   // 먹이가 개미집(거미줄)에 안착 → 정지
      }
      __buzz&&__buzz(15);
      render(); check();
    } else {
      snapshot();
      pr=tr; pc=tc; moves++; histDirs.push(di);
      __buzz&&__buzz(10);
      render();
    }
  }

  // 스와이프 전용: 그 방향으로 벽/먹이에 막힐 때까지 쭉 이동(걷기도 밀기도 끝까지)
  function swipeMove(di){ if(playing||gameOver) return;
    const [dy,dx]=DIRS[di]; const ar=pr+dy, ac=pc+dx;
    if(isWall(ar,ac)){ setMsg("벽이라 못 가요.","warn"); return; }
    const pushing=isBox(ar,ac);
    if(pushing && (isWall(ar+dy,ac+dx)||isBox(ar+dy,ac+dx))){ setMsg("먹이를 더 밀 수 없어요.","warn"); return; }
    snapshot();
    let moved=0;
    if(pushing){
      while(true){
        const br=pr+dy,bc=pc+dx, nr=br+dy,nc=bc+dx;
        if(!isBox(br,bc)) break;
        if(isWall(nr,nc)||isBox(nr,nc)) break;
        const k1=key(br,bc),k2=key(nr,nc),t=boxType.get(k1);
        boxes.delete(k1); boxes.add(k2); boxType.delete(k1); boxType.set(k2,t);
        pr=br; pc=bc; moves++; histDirs.push(di); moved++;
        if(isGoal(nr,nc)) break;   // 먹이가 개미집(거미줄)에 안착 → 정지
      }
    } else {
      while(true){
        const tr=pr+dy,tc=pc+dx;
        if(isWall(tr,tc)||isBox(tr,tc)) break;   // 벽이나 먹이 앞에서 정지
        pr=tr; pc=tc; moves++; histDirs.push(di); moved++;
      }
    }
    if(moved===0){ hist.pop(); return; }
    __buzz&&__buzz(pushing?15:10);
    render(); check();
  }

  // 인접 한 칸 탭: 딱 한 칸만 이동(밀기도 한 칸)
  function stepOne(di){ if(playing||gameOver) return;
    const [dy,dx]=DIRS[di]; const tr=pr+dy,tc=pc+dx;
    if(isWall(tr,tc)){ setMsg("벽이라 못 가요.","warn"); return; }
    if(isBox(tr,tc)){
      const br=tr+dy,bc=tc+dx;
      if(isWall(br,bc)||isBox(br,bc)){ setMsg("먹이를 더 밀 수 없어요.","warn"); return; }
      snapshot();
      const k1=key(tr,tc),k2=key(br,bc),t=boxType.get(k1);
      boxes.delete(k1); boxes.add(k2); boxType.delete(k1); boxType.set(k2,t);
      pr=tr; pc=tc; moves++; histDirs.push(di); __buzz&&__buzz(15); render(); check();
    } else {
      snapshot(); pr=tr; pc=tc; moves++; histDirs.push(di); __buzz&&__buzz(10); render();
    }
  }

  function tapCell(r,c){ if(playing||gameOver) return;
    if(r===pr&&c===pc) return;
    for(let di=0;di<4;di++){ const [dy,dx]=DIRS[di]; if(pr+dy===r&&pc+dx===c){ stepOne(di); return; } }  // 인접: 한 칸(밀기 가능)
    if(!isWall(r,c) && !isBox(r,c) && walkPathTo(r,c)) return;   // 빈 칸 + 먹이 안 밀고 걸어갈 수 있으면 경로 따라 곧장
    if((r===pr)!==(c===pc)){ glideTo(r,c); return; }             // 같은 행/열 직선: 기존 슬라이드(필요 시 먹이 1개 밀기)
    setMsg("막혀서 그쪽으로 못 가요. 먹이를 밀어야 하는 곳은 방향키로 옮겨요.","warn");
  }
  // 빈 칸을 탭하면 벽·먹이를 피해 걷는 최단 경로(BFS)가 있는지 찾아 그 경로대로 곧장 걸어가요. 먹이는 절대 안 밀어요.
  function walkPathTo(tr,tc){
    if(!inb(tr,tc)||isWall(tr,tc)||isBox(tr,tc)) return false;
    const seen=Array.from({length:R},()=>Array(C).fill(false));
    const from=Array.from({length:R},()=>Array(C).fill(-1));
    const q=[[pr,pc]]; seen[pr][pc]=true; let head=0, found=false;
    while(head<q.length){
      const cr=q[head][0], cc=q[head][1]; head++;
      if(cr===tr&&cc===tc){ found=true; break; }
      for(let di=0;di<4;di++){ const [dy,dx]=DIRS[di]; const nr=cr+dy,nc=cc+dx;
        if(!inb(nr,nc)||seen[nr][nc]||isWall(nr,nc)||isBox(nr,nc)) continue;   // 먹이는 벽처럼 막힘
        seen[nr][nc]=true; from[nr][nc]=di; q.push([nr,nc]);
      }
    }
    if(!found) return false;
    const dirs=[]; let cr=tr, cc=tc;
    while(!(cr===pr&&cc===pc)){ const di=from[cr][cc]; if(di<0) return false; dirs.push(di); const [dy,dx]=DIRS[di]; cr-=dy; cc-=dx; }
    dirs.reverse();
    if(!dirs.length) return false;
    snapshot();                          // 한 번만 → 무르기(↩) 한 번이 이 이동 전체를 되돌림
    playing=true; const tk=token; let k=0;
    // 걷기 중엔 먹이/둥지를 다시 그리지 않고 개미(플레이어) 노드만 옮겨 깜박임을 없앤다.
    const antEl=boardEl.querySelector(".ant");
    const bumpStatus=()=>{ statusEl.innerHTML='<span class="chip">👣 <b>'+moves+'</b> 수</span>'
      +'<span class="chip">🏠 <b>'+onGoalCount()+'</b> / '+boxes.size+'</span>'; };
    (function step(){ if(tk!==token||!playing) return;
      if(k>=dirs.length){ playing=false; __buzz&&__buzz(10); setMsg(mode==="kid"?"스르륵~ 걸어갔어요! 🕷️":"스르륵~ 걸어갔어요! 🐜","good"); return; }
      const di=dirs[k++]; const [dy,dx]=DIRS[di]; pr+=dy; pc+=dx; moves++; histDirs.push(di);
      const cellEl=boardEl.children[pr*C+pc];
      if(antEl && cellEl){ cellEl.appendChild(antEl); bumpStatus(); }   // 개미 노드만 이동 (먹이 SVG 재생성 X)
      else render();                                                    // 안전망
      setTimeout(step, 85);
    })();
    return true;
  }
  function glideTo(r,c){
    const dr=Math.sign(r-pr), dc=Math.sign(c-pc);
    const di = dr!==0 ? (dr>0?0:1) : (dc>0?2:3);
    snapshot();
    let cr=pr, cc=pc, moved=0, pushed=false;
    while(cr!==r || cc!==c){
      const nr=cr+dr, nc=cc+dc;                 // 다음 칸
      if(isWall(nr,nc)) break;                  // 벽 → 그 앞에서 멈춤
      if(isBox(nr,nc)){
        const br=nr+dr, bc=nc+dc;               // 먹이 너머 칸
        if(isWall(br,bc)||isBox(br,bc)) break;  // 벽이거나 또 다른 먹이 → 그 앞에서 멈춤
        const k1=key(nr,nc),k2=key(br,bc),t=boxType.get(k1);   // 먹이 1개 밀기
        boxes.delete(k1); boxes.add(k2); boxType.delete(k1); boxType.set(k2,t);
        pushed=true;
      }
      cr=nr; cc=nc; pr=cr; pc=cc; moves++; histDirs.push(di); moved++;
    }
    if(moved===0){ hist.pop(); setMsg("그쪽으로 갈 수 없어요.","warn"); return; }
    __buzz&&__buzz(pushed?15:10);
    render(); check();
    setMsg(pushed?"먹이를 밀며 이동!":"스르륵~ 이동!","good");
  }

  function check(){
    let done=true; goals.forEach(k=>{ if(!boxes.has(k)) done=false; });
    if(boxes.size>0 && done){ win(); }
    else setMsg(mode==="kid"?"좋아요! 계속 밀어요 🕸️":"좋아요! 계속 밀어요 🐜","good");
  }

  function win(){ gameOver=true; playing=false;
    cleared[stage]=true;
    if(!bestMoves[stage] || moves<bestMoves[stage]) bestMoves[stage]=moves;
    savePrefs();
    document.getElementById("bestNum").textContent=bestMoves[stage]+"수";
    const mBtn=document.getElementById("mBtn");
    const isLast=(stage>=N-1);
    if(isLast){
      document.getElementById("mTitle").textContent="🎊 마지막 "+N+"판 클리어!";
      document.getElementById("mText").innerHTML="모든 스테이지를 완주했어요! 대단해요 👏";
      mBtn.style.display="none";
    } else {
      document.getElementById("mTitle").textContent="클리어! 🎉 "+(stage+1)+"판";
      document.getElementById("mText").innerHTML="👏 <b>"+moves+"</b>수 만에 성공!";
      mBtn.style.display=""; mBtn.textContent="다음 판 ▶";
    }
    overlay.classList.add("show");
    __buzz&&__buzz([26,38,32]);
    if(mode==="kid") celebrate();
  }

  function undo(){ if(playing) return;
    if(!hist.length){ setMsg("되돌릴 수 없어요.","warn"); return; }
    const h=hist.pop();
    boxes=new Set(h.b); boxType=new Map(h.bt); pr=h.pr; pc=h.pc; moves=h.moves;
    histDirs.length=h.hd;
    gameOver=false; overlay.classList.remove("show"); render(); setMsg("한 수 되돌렸어요.","good");
  }

  // hint: if the player has followed the stored solution so far, show the next step;
  // otherwise run a bounded search from the current state.
  function prefixMatches(){
    if(histDirs.length>solMoves.length) return false;
    for(let i=0;i<histDirs.length;i++) if(histDirs[i]!==solMoves[i]) return false;
    return true;
  }
  function hint(){ if(playing||gameOver) return;
    let di=null;
    if(prefixMatches() && histDirs.length<solMoves.length) di=solMoves[histDirs.length];
    if(di===null){ const s=solveBFS(60000); if(s&&s.length) di=s[0]; }
    if(di===null){ setMsg("막혔을 수 있어요. ↩되돌리기 하거나 ‘정답 보기’를 눌러요.","warn"); return; }
    const [dy,dx]=DIRS[di]; render([pr+dy,pc+dx]); setMsg("💡 저쪽으로 움직여요!","good");
  }

  // bounded Sokoban BFS from current state (for hint fallback)
  function solveBFS(cap){
    const goalArr=Array.from(goals);
    const startB=Array.from(boxes).sort().join(";");
    const solvedNow=()=>{ for(const g of goalArr) if(!boxes.has(g)) return false; return true; };
    if(solvedNow()) return [];
    const enc=(p,bs)=>p[0]+","+p[1]+"|"+bs;
    const seen=new Set(); const parent=new Map();
    const startKey=enc([pr,pc],startB); seen.add(startKey); parent.set(startKey,null);
    let q=[{p:[pr,pc],b:new Set(boxes),k:startKey}],head=0,nodes=0;
    while(head<q.length){
      if(nodes++>cap) return null;
      const cur=q[head++];
      for(let di=0;di<4;di++){
        const [dy,dx]=DIRS[di]; const tr=cur.p[0]+dy,tc=cur.p[1]+dx;
        if(isWall(tr,tc)) continue;
        let nb=cur.b, moved=false;
        if(cur.b.has(key(tr,tc))){
          const br=tr+dy,bc=tc+dx;
          if(isWall(br,bc)||cur.b.has(key(br,bc))) continue;
          nb=new Set(cur.b); nb.delete(key(tr,tc)); nb.add(key(br,bc)); moved=true;
        }
        const bs=Array.from(nb).sort().join(";");
        const nk=enc([tr,tc],bs);
        if(seen.has(nk)) continue; seen.add(nk); parent.set(nk,{k:cur.k,di});
        let done=true; for(const g of goalArr) if(!nb.has(g)){ done=false; break; }
        if(done){ const path=[]; let kk=nk; while(parent.get(kk)){ path.push(parent.get(kk).di); kk=parent.get(kk).k; } return path.reverse(); }
        q.push({p:[tr,tc],b:nb,k:nk});
      }
    }
    return null;
  }

  function resetToStart(){
    boxes=new Set(startBoxes); boxType=new Map(startBoxType); pr=startPr; pc=startPc; moves=0; hist=[]; histDirs=[]; gameOver=false;
  }

  function playSolution(){ if(playing) return;
    if(!solMoves.length){ setMsg("정답 정보가 없어요.","warn"); return; }
    resetToStart(); overlay.classList.remove("show"); render();
    playing=true; setMsg("💡 정답을 보여줄게요 ("+solMoves.length+"수)!","good");
    let k=0; const tk=token;
    (function step(){ if(tk!==token||!playing) return;
      if(k>=solMoves.length){ playing=false;
        let done=true; goals.forEach(g=>{ if(!boxes.has(g)) done=false; });
        if(done) win(); return; }
      const di=solMoves[k++]; const [dy,dx]=DIRS[di]; const tr=pr+dy,tc=pc+dx;
      if(isBox(tr,tc)){ const br=tr+dy,bc=tc+dx,__k1=key(tr,tc),__k2=key(br,bc),__t=boxType.get(__k1); boxes.delete(__k1); boxes.add(__k2); boxType.delete(__k1); boxType.set(__k2,__t); }
      pr=tr; pc=tc; moves++; render();
      setTimeout(step, 260);
    })();
  }

  function restart(){ if(playing){ playing=false; token++; } resetToStart(); overlay.classList.remove("show"); render(); setMsg("스테이지를 처음부터 다시!","good"); }
  function openLevel(i){ if(playing){ playing=false; token++; }
    stage=lastLevel=Math.max(0,Math.min(N-1,i)); overlay.classList.remove("show");
    document.getElementById("selectView").style.display="none";
    document.getElementById("playView").style.display="";
    loadStage(stage); sizeBoard();
  }
  function goDelta(d){ openLevel(stage+d); }
  function showList(){ if(playing){ playing=false; token++; }
    overlay.classList.remove("show"); savePrefs();
    document.getElementById("playView").style.display="none";
    document.getElementById("selectView").style.display="";
    buildGrid();
  }
  function buildGrid(){
    const g=document.getElementById("lvGrid"); g.innerHTML="";
    for(let i=0;i<N;i++){
      const b=document.createElement("button");
      b.className="lv"+(cleared[i]?" done":"")+(i===lastLevel?" cur":"");
      b.innerHTML='<span class="ln">'+(i+1)+'</span>'+(cleared[i]?'<span class="chk">✓</span>':'');
      b.addEventListener("click",()=>openLevel(i));
      g.appendChild(b);
    }
    const done=cleared.filter(Boolean).length;
    const p=document.getElementById("lvProgress"); if(p) p.textContent=done+" / "+N+" 판 클리어";
  }

  // ---- mode (원작/어린이) ----
  function updateModeUI(){
    const t=document.querySelector(".selTitle"); if(t) t.textContent=(mode==="kid")?"🐣 어린이 (쉬움)":(mode==="sasq")?"🦶 사스콰치":"클래식";
    document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on", b.dataset.mode===mode));
    document.body.classList.toggle("kidmode", mode==="kid");
  }
  function applyMode(m){
    mode=(m==="kid"||m==="sasq")?m:"classic";
    CUR=SETS[mode]||LEVELS; N=CUR.length;
    PREF_KEY=(mode==="kid")?"pushpush_kid_v1":(mode==="sasq")?"pushpush_sasq_v1":"pushpush_classic_v1";
    cleared=new Array(N).fill(false); bestMoves=new Array(N).fill(0); lastLevel=0; stage=0;
    loadPrefs();
    try{ localStorage.setItem("pushpush_mode",mode); }catch(e){}
    updateModeUI();
  }
  function setMode(m){ if(m===mode) return; savePrefs(); applyMode(m); buildGrid(); }

  // ---- 축하 효과: 별 + 색종이 (어린이 모드 클리어 시) ----
  function celebrate(){
    const host=document.getElementById("playView")||document.body;
    const wrap=document.createElement("div"); wrap.className="confettiWrap";
    const cols=["#ff5a7a","#ffd23f","#4fc3f7","#8bd94a","#b07cff","#ff924c","#ff5a7a","#ffd23f"];
    const N2=44;
    for(let i=0;i<N2;i++){
      const d=document.createElement("div");
      const star=Math.random()<0.28;
      d.className="confetti"+(star?" star":"");
      if(star){ d.textContent=(Math.random()<0.5?"⭐":"✨"); }
      else { d.style.background=cols[i%cols.length]; }
      d.style.left=(Math.random()*100)+"%";
      d.style.setProperty("--dx",((Math.random()*2-1)*120)+"px");
      d.style.setProperty("--rot",(Math.random()*720-360)+"deg");
      d.style.animationDelay=(Math.random()*0.35)+"s";
      d.style.animationDuration=(1.5+Math.random()*1.1)+"s";
      wrap.appendChild(d);
    }
    host.appendChild(wrap);
    setTimeout(()=>{ wrap.remove(); }, 2800);
  }

  // ---- events ----
  document.querySelectorAll(".dpad button").forEach(b=>b.addEventListener("click",()=>stepOne(+b.dataset.dir)));
  document.getElementById("undoBtn").addEventListener("click",undo);
  document.getElementById("hintBtn").addEventListener("click",hint);
  document.getElementById("solveBtn").addEventListener("click",playSolution);
  document.getElementById("restartBtn").addEventListener("click",restart);
  document.getElementById("prevBtn").addEventListener("click",()=>goDelta(-1));
  document.getElementById("nextBtn").addEventListener("click",()=>goDelta(1));
  document.getElementById("listBtn").addEventListener("click",showList);
  document.getElementById("mBtn").addEventListener("click",()=>goDelta(1));
  document.getElementById("mReplay").addEventListener("click",restart);
  document.getElementById("mList").addEventListener("click",showList);
  overlay.addEventListener("click",e=>{ if(e.target===overlay) overlay.classList.remove("show"); });
  window.addEventListener("keydown",e=>{ const m={ArrowUp:1,ArrowDown:0,ArrowLeft:3,ArrowRight:2}; if(m[e.key]!==undefined){ e.preventDefault(); stepOne(m[e.key]); } });
  window.addEventListener("resize",()=>{ if(R) sizeBoard(); });
  window.addEventListener("load",()=>{ if(R) sizeBoard(); });
  setTimeout(()=>{ if(R) sizeBoard(); }, 250);

  // swipe
  let sx,sy;
  boardEl.addEventListener("touchstart",e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  boardEl.addEventListener("touchend",e=>{ if(sx==null)return; const t=e.changedTouches[0]; const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<24&&Math.abs(dy)<24){ sx=null; return; }
    if(Math.abs(dx)>Math.abs(dy)) swipeMove(dx>0?2:3); else swipeMove(dy>0?0:1); sx=null; },{passive:true});

  (function(){var b=document.getElementById("rulesFab"),o=document.getElementById("rulesOverlay");
    b.addEventListener("click",()=>o.classList.add("show")); o.addEventListener("click",()=>o.classList.remove("show"));})();

  document.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

  (function(){ let m="classic"; try{ const s=localStorage.getItem("pushpush_mode"); if(s==="kid"||s==="sasq") m=s; }catch(e){} applyMode(m); })();
  buildGrid();
  // classic flow: start on the numbered level-select screen
})();
</script>
<script id="framelink">
(function(){
  function caps(){ try{ parent.postMessage({type:'game-caps', tutorial:!!document.getElementById('tutFab'), rules:!!document.getElementById('rulesFab')}, '*'); }catch(e){} }
  window.addEventListener('message',function(e){ var d=e.data||{};
    if(d.type==='ui-rules'){ var r=document.getElementById('rulesFab'); if(r) r.click(); }
    if(d.type==='ui-tut'){ var t=document.getElementById('tutFab'); if(t) t.click(); }
  });
  if(document.readyState!=='loading') caps(); else window.addEventListener('DOMContentLoaded',caps);
  setTimeout(caps,150);
})();
</script>
<script id="haptics">
(function(){
  var inFrame=false; try{ inFrame=(window.parent && window.parent!==window); }catch(e){ inFrame=true; }
  function buzz(p){ if(inFrame){ try{ parent.postMessage({type:'buzz',p:p},'*'); return; }catch(e){} } try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  window.__buzz=buzz;
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('button')){ buzz(8); return; }
    if(e.target.closest('.cell,.item,.ant,.board')){ buzz(13); }
  },true);
  function watch(el){ if(!el) return; try{ new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ if(ms[i].attributeName==='class' && el.classList.contains('show')){ buzz([26,38,32]); break; } } }).observe(el,{attributes:true,attributeFilter:['class']}); }catch(e){} }
  function initWatch(){ var el=document.getElementById('overlay'); if(el) watch(el); }
  if(document.readyState!=='loading') initWatch(); else window.addEventListener('DOMContentLoaded',initWatch);
})();
</script>

  <template id="tpl-memory"><!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>곤충 메모리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  body{font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(760px 380px at 82% -8%,#eef6e6,transparent 60%),linear-gradient(180deg,#f4f9ee,#e9f1df);}
  .wrap{max-width:min(96vw,1200px);margin:0 auto;padding:3px 6px;height:100dvh;display:flex;flex-direction:column;gap:6px;overflow:hidden;}
  header{text-align:center;flex:0 0 auto;}
  h1{font-family:"Jua";font-weight:400;font-size:clamp(18px,4.4vw,25px);margin:6px 0 0;color:var(--hl-soft);}
  .topbar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;flex:0 0 auto;}
  .seg{display:inline-flex;background:#eef3e6;border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .seg button{font-family:"Jua";font-size:14px;border:none;background:transparent;color:var(--muted);border-radius:999px;padding:6px 15px;cursor:pointer;transition:background .15s;}
  .seg button.on{background:var(--hl);color:#fff;box-shadow:0 2px 0 var(--hl-soft);}
  .status{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;flex:0 0 auto;font-family:"Jua";font-size:15px;}
  .chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 13px;display:flex;gap:6px;align-items:center;}
  .chip.best{color:#b07d1c;background:#fff6e0;border-color:#e7cf95;}

  .mid{flex:1 1 auto;min-height:0;display:flex;align-items:safe center;justify-content:center;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;}
  .mid::-webkit-scrollbar{width:9px;height:9px;}
  .mid::-webkit-scrollbar-thumb{background:#b7cfa2;border-radius:9px;}
  .mid::-webkit-scrollbar-track{background:transparent;}
  .board{display:grid;gap:min(2.4vw,11px);margin:0 auto;touch-action:none;}

  .card{position:relative;aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;perspective:640px;}
  .card .inner{position:absolute;inset:0;transition:transform .38s cubic-bezier(.4,.1,.3,1.05);transform-style:preserve-3d;}
  .card.up .inner,.card.done .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:15%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .back{background:linear-gradient(150deg,#7bc26a,#4c9c47);border:3px solid #3c8038;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 3px 6px rgba(30,50,20,.28);}
  .back::after{content:"🐛";font-size:min(7vw,34px);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));opacity:.92;}
  .front{background:#fff;border:3px solid var(--line);transform:rotateY(180deg);flex-direction:column;gap:2%;box-shadow:0 3px 7px rgba(30,50,20,.2);}
  .front svg{width:76%;height:66%;display:block;}
  .front .nm{font-family:"Jua";font-size:min(3.2vw,15px);color:#3a4a33;line-height:1;}
  .card.done .front{border-color:#8fd07a;background:#f2fbee;animation:pop .4s ease;}
  .card.done{cursor:default;}
  .card.shake .inner{animation:shk .4s ease;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.09);}100%{transform:scale(1);}}
  @keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .message{flex:0 0 auto;text-align:center;font-size:13px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 12px;line-height:1.4;}
  .message.good{border-color:#9ccf86;color:#2f6b28;} .message.warn{border-color:#e0b45a;color:#b07d1c;}
  .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:0 0 auto;margin-bottom:2px;}
  .btn{font-family:"Jua";font-size:14px;border:none;border-radius:12px;padding:8px 16px;cursor:pointer;color:#fff;background:var(--hl);box-shadow:0 3px 0 var(--hl-soft);}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;}

  .rulesFab{position:fixed;top:8px;right:8px;z-index:41;font-family:"Jua";font-size:12.5px;border:2px solid rgba(0,0,0,.14);cursor:pointer;background:#fff;color:#333;padding:6px 11px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);}
  .rulesOverlay,.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;}
  .rulesOverlay{background:rgba(25,40,20,.66);z-index:96;cursor:pointer;} .rulesOverlay.show,.overlay.show{display:flex;}
  .rulesSheet{background:#fff;width:100%;max-width:440px;max-height:90vh;overflow:auto;border-radius:18px;padding:18px;line-height:1.6;font-size:14px;color:#3a3a3a;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.45);}
  .rulesSheet h2{font-family:"Jua";color:var(--hl-soft);margin:2px 0 10px;} .rulesSheet b{color:var(--hl-soft);}
  .rulesSheet ul{margin:6px 0;padding-left:20px;} .rulesSheet li{margin:5px 0;}
  .overlay{background:rgba(25,40,20,.55);z-index:80;}
  .modal{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px 22px;text-align:center;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.45);}
  .modal .ic{font-size:40px;} .modal h2{font-family:"Jua";margin:6px 0 4px;color:var(--hl-soft);} .modal p{margin:2px 0 14px;color:#555;}
</style>

        +(b?'<span class="chip best">🏅 '+b.flips+'회·'+fmt(b.secs)+'</span>':'');

  function setPlayers(n){ n=+n; if(!(n>=1&&n<=4)) return; players=n; savePrefs();

  function stepTo(nr,nc){
    // 완전미로라 재방문은 '바로 직전 칸'뿐 → 그 경우는 되돌아가기(자취 삭제)
    const prev = path.length>=2 ? path[path.length-2] : null;
    if(prev && prev[0]===nr && prev[1]===nc){
      path.pop();                                            // 왔던 길 되돌아가면 자취 사라짐
    } else {
      path.push([nr,nc]);                                    // 새 길이면 무지개 자취 추가
    }
    pr=nr; pc=nc; moves++; movesEl.textContent=moves;
    drawTrail();
    startTimerIfNeeded();
    playerEl.style.transition="left .09s linear,top .09s linear";
    placePlayer(true);
    ensureVisible();
    if(pr===gr&&pc===gc){ buzz([15,30]); setTimeout(win,120); }
  }

  // ============ 손가락 트레이스: 손끝을 향해 통로를 따라 곤충이 따라옴 ============
  function pointToXY(clientX,clientY){ const rect=boardEl.getBoundingClientRect();
    return { x:clientX-rect.left, y:clientY-rect.top }; }
  function fingerInCell(px,py,r,c){ const x0=c*cell, y0=r*cell; return px>=x0 && px<x0+cell && py>=y0 && py<y0+cell; }
  function advanceToward(px,py){
    if(won) return;
    let guard=0, maxStep=N*N;
    while(guard++<maxStep){
      // 1순위: 손끝이 '지금 올라와 있는' 열린 인접 칸으로만 이동 → 통로 폭 안에서 좌우로 안 튐(와따가따 방지)
      let target=null;
      for(const d of ["up","down","left","right"]){ if(!openTo(pr,pc,d)) continue;
        const nr=pr+DZ[d][0], nc=pc+DZ[d][1];
        if(fingerInCell(px,py,nr,nc)){ target=[nr,nc]; break; } }
      if(target){ stepTo(target[0],target[1]); if(won) break; continue; }
      // 손끝이 현재 칸 안이면 멈춤(움직임 없음 → 미세 지터 무시)
      if(fingerInCell(px,py,pr,pc)) break;
      // 2순위(빠른 드래그): 손끝이 멀리 있으면 손끝을 향해 열린 이웃으로 한 칸만. 벽이면 멈춤.
      const curCx=(pc+0.5)*cell, curCy=(pr+0.5)*cell;
      const curd=(curCx-px)*(curCx-px)+(curCy-py)*(curCy-py);
      let best=null, bestd=curd;
      for(const d of ["up","down","left","right"]){ if(!openTo(pr,pc,d)) continue;
        const nr=pr+DZ[d][0], nc=pc+DZ[d][1]; const nx=(nc+0.5)*cell, ny=(nr+0.5)*cell;
        const dd=(nx-px)*(nx-px)+(ny-py)*(ny-py);
        if(dd<bestd){ bestd=dd; best=[nr,nc]; } }
      if(!best){
        break;   // 벽에 막히면 흔들림 없이 그냥 멈춤
      }
      stepTo(best[0],best[1]);
      if(won) break;
    }
  }
  function onDown(clientX,clientY){ if(won) return; tracing=true; const p=pointToXY(clientX,clientY); advanceToward(p.x,p.y); }
  function onMove(clientX,clientY){ if(!tracing||won) return; const p=pointToXY(clientX,clientY); advanceToward(p.x,p.y); }
  function onUp(){ tracing=false; }

  // 입력 모드: 미로(칸) 위 한 손가락=곤충 트레이스 / 빈 곳 드래그=지도 이동(팬) / 두 손가락=핀치 확대
  let mode=null, panSX=0, panSY=0, panCX=0, panCY=0;
  let pinchD0=0, pinchZ0=1, pinchFx=0, pinchFy=0;
  function midXY(clientX,clientY){ const r=midEl.getBoundingClientRect(); return [clientX-r.left, clientY-r.top]; }
  function onCell(clientX,clientY){ const p=pointToXY(clientX,clientY); const r=Math.floor(p.y/cell), c=Math.floor(p.x/cell); return isIn(r,c); }
  function pinchStart(t1,t2){ mode="pinch"; tracing=false;
    pinchD0=Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY)||1; pinchZ0=Z;
    const mm=midXY((t1.clientX+t2.clientX)/2,(t1.clientY+t2.clientY)/2); const bp=cell*N;
    pinchFx=(mm[0]-camX)/bp; pinchFy=(mm[1]-camY)/bp; }
  function pinchMove(t1,t2){ const d=Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY)||1;
    const nz=Math.max(ZMIN,Math.min(ZMAX, pinchZ0*d/pinchD0));
    const mm=midXY((t1.clientX+t2.clientX)/2,(t1.clientY+t2.clientY)/2);
    Z=nz; relayout(); const bp=cell*N; camX=mm[0]-pinchFx*bp; camY=mm[1]-pinchFy*bp; applyCam(); updateZoomUI(); }

  midEl.addEventListener("touchstart",e=>{ e.preventDefault();
    if(e.touches.length>=2){ pinchStart(e.touches[0],e.touches[1]); return; }
    const t=e.changedTouches[0];
    if(!won && onCell(t.clientX,t.clientY)){ mode="trace"; onDown(t.clientX,t.clientY); }
    else { mode="pan"; panSX=t.clientX; panSY=t.clientY; panCX=camX; panCY=camY; }
  }, {passive:false});
  midEl.addEventListener("touchmove",e=>{ e.preventDefault();
    if(mode==="pinch" && e.touches.length>=2){ pinchMove(e.touches[0],e.touches[1]); return; }
    const t=e.changedTouches[0];
    if(mode==="trace"){ onMove(t.clientX,t.clientY); }
    else if(mode==="pan"){ camX=panCX+(t.clientX-panSX); camY=panCY+(t.clientY-panSY); applyCam(); }
  }, {passive:false});
  midEl.addEventListener("touchend",e=>{ if(mode==="pinch" && e.touches.length>=1){ mode=null; return; } onUp(); mode=null; }, {passive:true});

  // 데스크톱: 마우스 = 칸 위면 트레이스, 빈 곳이면 팬 / 휠 = 확대
  midEl.addEventListener("pointerdown",e=>{ if(e.pointerType==="touch") return;
    if(!won && onCell(e.clientX,e.clientY)){ mode="trace"; onDown(e.clientX,e.clientY); }
    else { mode="pan"; panSX=e.clientX; panSY=e.clientY; panCX=camX; panCY=camY; } });
  window.addEventListener("pointermove",e=>{ if(e.pointerType==="touch") return;
    if(mode==="trace"){ onMove(e.clientX,e.clientY); } else if(mode==="pan"){ camX=panCX+(e.clientX-panSX); camY=panCY+(e.clientY-panSY); applyCam(); } });
  window.addEventListener("pointerup",e=>{ if(e.pointerType==="touch") return; onUp(); mode=null; });
  midEl.addEventListener("wheel",e=>{ e.preventDefault(); const mm=midXY(e.clientX,e.clientY);
    zoomAt(mm[0],mm[1], Z*(e.deltaY<0?1.12:1/1.12)); }, {passive:false});
  window.addEventListener("keydown",e=>{ const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
    if(m[e.key]){ e.preventDefault(); const d=m[e.key]; if(openTo(pr,pc,d)){ stepTo(pr+DZ[d][0],pc+DZ[d][1]); } } });

  function win(){
    if(won) return; won=true; running=false; tracing=false;
    if(timer){ clearInterval(timer); timer=null; }
    const el=Date.now()-t0;
    const store=bestGet(); const prev=store[diff]; let rec=false;
    if(!prev || el<prev){ store[diff]=el; bestSet(store); rec=true; }
    bestEl.textContent=fmt(store[diff]);
    winIco.innerHTML=insect.svg;
    winStats.textContent=DIFF[diff].name+" · "+silh.name+" 미로 · ⏱ "+fmt(el)+" · 👣 "+moves+"수";
    winBest.textContent= rec ? "🏅 최고 기록 갱신!" : ("최고: "+fmt(store[diff]));
    winEl.classList.add("show"); celebrate();
  }
  function celebrate(){
    const wrap=document.createElement("div"); wrap.className="confettiWrap";
    const cols=["#e5544b","#ef8f39","#f1cf3b","#57c84d","#4a90d9","#9457c9","#ec6b9d"];
    for(let i=0;i<42;i++){ const d=document.createElement("div"); d.className="confetti";
      d.style.left=(Math.random()*100)+"%"; d.style.background=cols[(Math.random()*cols.length)|0];
      d.style.animationDuration=(1.6+Math.random()*1.4)+"s"; d.style.animationDelay=(Math.random()*0.3)+"s";
      d.style.transform="rotate("+(Math.random()*360)+"deg)"; wrap.appendChild(d); }
    for(let i=0;i<10;i++){ const s=document.createElement("div"); s.className="star"; s.textContent=Math.random()<.5?"⭐":"✨";
      s.style.left=(Math.random()*100)+"%"; s.style.animationDuration=(1.8+Math.random()*1.3)+"s"; s.style.animationDelay=(Math.random()*0.4)+"s"; wrap.appendChild(s); }
    document.body.appendChild(wrap); setTimeout(()=>wrap.remove(), 3200);
  }

  // ================= UI 배선 =================
  document.querySelectorAll("#diffSeg button").forEach(b=>{
    b.addEventListener("click",()=>{ diff=b.dataset.d; try{localStorage.setItem(DIFF_KEY,diff);}catch(e){}
      document.querySelectorAll("#diffSeg button").forEach(x=>x.classList.toggle("on",x===b)); newMaze(); });
  });
  document.getElementById("newBtn").addEventListener("click",newMaze);
  document.getElementById("againBtn").addEventListener("click",newMaze);
  document.getElementById("zoomIn").addEventListener("click",()=>setZoom(Z+0.5));
  document.getElementById("zoomOut").addEventListener("click",()=>setZoom(Z-0.5));
  window.addEventListener("resize",()=>{ if(cells.length){ sizeBoard(); } });
  window.addEventListener("message",e=>{ const d=e.data; if(d&&d.type==="haptics") hapOn=!!d.on; });

  (function(){ document.querySelectorAll("#diffSeg button").forEach(x=>x.classList.toggle("on",x.dataset.d===diff)); })();
  newMaze();
  setTimeout(sizeBoard,60);
  setTimeout(sizeBoard,260);
})();
</script>

<body>
<button class="tutFab" id="tutFab">🎓 튜토리얼</button>
<div class="tutOverlay" id="tutOverlay"><div class="tutCard">
  <div class="tutEmoji" id="tutEmoji"></div>
  <div class="tutText" id="tutText"></div>
  <div class="tutDots" id="tutDots"></div>
  <div class="tutNav"><button id="tutPrev">◀ 이전</button><button id="tutNext">다음 ▶</button><button id="tutClose">닫기</button></div>
</div></div>
<button class="rulesFab" id="rulesFab" aria-label="규칙 보기">📖 규칙보기</button>
<div class="rulesOverlay" id="rulesOverlay" role="dialog" aria-label="게임 규칙">
  <div class="rulesSheet">
    <h3>🐝 곤충 카후나 — 규칙</h3>
    <h4>목표</h4>
    <ul><li>12개 꽃섬 사이에 <b>덩굴 다리</b>를 놓아요. 한 섬에 이어진 다리의 <b>과반</b>을 차지하면 그 섬을 <b>지배</b>(내 표식)해요.</li>
    <li>3번의 점수 순간에 <b>더 많은 섬을 지배</b>하면 점수! 총점이 높은 쪽이 승리.</li></ul>
    <h4>내 차례</h4>
    <ul><li>손의 <b>섬 카드</b>를 원하는 만큼 내요(0장도 가능). 그다음 카드 <b>1장</b>을 뽑아요(손패 최대 5장).</li>
    <li><b>다리 놓기:</b> 섬 카드 1장을 내고, 그 섬에서 나가는 <b>빈 연결선</b> 하나에 내 다리를 놓아요.</li>
    <li><b>다리 제거:</b> 상대 다리를 없애려면 그 다리 양 끝 섬 카드로 <b>2장</b>이 필요해요(같은 섬 2장, 또는 양쪽 섬 1장씩). 상대 다리를 눌러 제거해요.</li></ul>
    <h4>지배와 연쇄</h4>
    <ul><li>어떤 섬의 다리 <b>과반</b>을 차지하면 표식을 놓고, 그 섬에 있던 <b>상대 다리는 모두 제거</b>돼요(연쇄로 다른 섬 지배가 바뀔 수 있어요).</li></ul>
    <h4>점수</h4>
    <ul><li>1라운드: 더 많이 지배한 쪽 <b>+1점</b>, 2라운드 <b>+2점</b>, 3라운드는 <b>지배 수 차이</b>만큼 점수.</li>
    <li>뽑을 카드가 다 떨어지면 그 라운드가 끝나요.</li></ul>
    <div class="tapclose">설명서를 누르면 닫혀요</div>
  </div>
</div>

<div class="wrap">
  <header class="top"><h1>🐝 곤충 카후나</h1></header>
  <div style="text-align:center;flex:0 0 auto;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
    <div class="kseg" id="modeSeg"><button data-mode="cpu" class="on">컴퓨터와</button><button data-mode="two">둘이서</button></div>
    <div class="kseg" id="diffSeg"><button data-diff="easy">쉬움</button><button data-diff="normal" class="on">보통</button><button data-diff="hard">어려움</button></div>
  </div>
  <div class="scorebar" id="scorebar"></div>
  <div class="mid">
    <div class="side" id="side0"></div>
    <div class="boardwrap"><svg id="edges" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="isles"></div></div>
    <div class="side" id="side1"></div>
  </div>
  <div class="draws" id="draws"></div>
  <div class="message good" id="message"></div>
  <div class="actions">
    <button class="btn ghost" id="passBtn">안 뽑고 넘기기</button>
    <button class="btn ghost" id="undoBtn">↩ 무르기</button>
    <button class="btn ghost" id="resetBtn">새 게임</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <div style="font-size:30px" id="mIcon">🏆</div>
  <h2 id="mTitle"></h2><p id="mText"></p>
  <button class="btn" id="mBtn">확인</button>
</div></div>

<script>
(function(){
  "use strict";
  const FLOWER=["🌸","🌻","🌷","🌼","🪷","🌺","🍀","🌹","💐","🏵️","🌾","🌱"];
  const POS=[[15,17],[40,11],[66,15],[86,27],[10,44],[36,40],[60,44],[85,54],[20,71],[45,74],[69,70],[89,83]];
  const EDGES=[[0,1],[0,4],[0,5],[1,2],[1,5],[2,3],[2,6],[3,7],[4,5],[4,8],[5,6],[5,9],[5,8],[6,7],[6,10],[6,9],[7,11],[8,9],[9,10],[10,11]];
  const DEG=Array(12).fill(0); const INC=Array.from({length:12},()=>[]);
  EDGES.forEach((e,i)=>{ DEG[e[0]]++;DEG[e[1]]++; INC[e[0]].push(i);INC[e[1]].push(i); });

  let bridge;     // Map edgeIndex -> 0/1
  let token;      // [12] -> 0/1/null
  let deck, discard, hands, scores, round, turn, sel, gameOver;
  let hist=[];
  let mode="cpu", diff="normal", uiLock=false, revealed=false;
  let lastEdge=-1;
  let animBreak=new Set(), animPop=new Set(), animFade=new Set(), animating=false, winnerP=-1;

  const edgesSvg=document.getElementById("edges");
  const islesEl=document.getElementById("isles");
  const handEl=document.getElementById("hand");
  const drawsEl=document.getElementById("draws");
  const scorebar=document.getElementById("scorebar");
  const msgEl=document.getElementById("message");
  const overlay=document.getElementById("overlay");
  const mTitle=document.getElementById("mTitle"),mText=document.getElementById("mText"),mIcon=document.getElementById("mIcon");
  const pname=p=>p===0?"노랑벌 🐝":"보라나비 🦋";
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

  function makeDeck(){ const d=[]; for(let i=0;i<12;i++){d.push(i);d.push(i);} return shuffle(d); }
  function snap(){ return JSON.stringify({bridge:[...bridge],token:token.slice(),deck:deck.slice(),discard:discard.slice(),hands:hands.map(x=>x.slice()),scores:scores.slice(),round:round,turn:turn,gameOver:gameOver,lastEdge:lastEdge,winnerP:winnerP}); }
  function pushHist(){ hist.push(snap()); if(hist.length>80) hist.shift(); }
  function restoreSnap(s){ const o=JSON.parse(s); bridge=new Map(o.bridge); token=o.token; deck=o.deck; discard=o.discard; hands=o.hands; scores=o.scores; round=o.round; turn=o.turn; gameOver=o.gameOver; lastEdge=o.lastEdge; winnerP=o.winnerP; }
  function undo(){
    if(animating) return;
    if(!hist.length){ setMsg("무를 수가 없어요.","warn"); return; }
    restoreSnap(hist.pop());
    if(mode==="cpu"){ let g=0; while(hist.length && turn===1 && g++<10) restoreSnap(hist.pop()); }
    sel=null; revealed=false; uiLock=false; animBreak.clear(); animPop.clear(); animFade.clear();
    document.querySelector(".overlay").classList.remove("show");
    render(); setMsg("한 수 물렀어요.","good");
  }
  function newGame(){
    bridge=new Map(); token=Array(12).fill(null);
    let d=makeDeck();
    hands=[[d.pop(),d.pop(),d.pop()],[d.pop(),d.pop(),d.pop()]];
    deck=d; discard=[];
    scores=[0,0]; round=1; turn=0; sel=null; gameOver=false; revealed=false; lastEdge=-1; winnerP=-1;
    overlay.classList.remove("show");
    render(); setMsg(`<b>${pname(0)}</b> 차례! 섬 카드를 골라 빈 연결선에 다리를 놓거나, 상대 다리를 눌러 제거하세요.`,"good");
  }

  const cnt=(i,p)=>INC[i].reduce((s,ei)=>s+((bridge.get(ei)===p)?1:0),0);
  // only the player who just acted (P) can gain majority and thereby remove the opponent's bridges
  // Only the islands at the two ends of the just-built/removed bridge can trigger removal.
  // If the current player (P) now has the majority there, remove the opponent's bridges FROM THAT ISLAND ONLY (no chain reaction to distant islands).
  function resolveControl(P, ei){
    const O=1-P;
    const isls = (ei!=null && EDGES[ei]) ? EDGES[ei] : [];
    for(const i of isls){
      if(cnt(i,P)>DEG[i]/2){ INC[i].forEach(e=>{ if(bridge.get(e)===O) bridge.delete(e); }); }
    }
    for(let i=0;i<12;i++){ const c0=cnt(i,0),c1=cnt(i,1); token[i]= c0>DEG[i]/2?0 : (c1>DEG[i]/2?1:null); }
  }
  function flyEl(fromEl,toEl,html,dur,cb){
    if(!fromEl||!toEl){ if(cb)cb(); return; }
    const fr=fromEl.getBoundingClientRect(), tr=toEl.getBoundingClientRect();
    const c=document.createElement("div");
    c.style.cssText="position:fixed;z-index:210;pointer-events:none;left:"+(fr.left+fr.width/2)+"px;top:"+(fr.top+fr.height/2)+"px;transform:translate(-50%,-50%);transition:transform "+dur+"ms cubic-bezier(.35,.1,.3,1),opacity "+dur+"ms;";
    c.innerHTML=html; document.body.appendChild(c);
    const dx=(tr.left+tr.width/2)-(fr.left+fr.width/2), dy=(tr.top+tr.height/2)-(fr.top+fr.height/2);
    requestAnimationFrame(function(){ c.style.transform="translate(-50%,-50%) translate("+dx+"px,"+dy+"px) scale(1.15)"; });
    setTimeout(function(){ c.remove(); if(cb)cb(); }, dur+40);
  }
  function animateResolve(beforeB, beforeT, finalB, finalT){
    const removed=[]; beforeB.forEach((ow,ei)=>{ if(!finalB.has(ei)) removed.push(ei); });
    const tokAdd=[], tokDel=[];
    for(let i=0;i<12;i++){ if(beforeT[i]!==finalT[i]){ if(finalT[i]!=null) tokAdd.push(i); else tokDel.push(i); } }
    if(!removed.length && !tokAdd.length && !tokDel.length){ bridge=finalB; token=finalT; render(); return; }
    animating=true; bridge=new Map(beforeB); token=beforeT.slice(); render();
    const seq=[];
    removed.forEach(ei=>seq.push({t:"break",ei}));
    tokDel.forEach(i=>seq.push({t:"del",i}));
    tokAdd.forEach(i=>seq.push({t:"add",i}));
    let k=0;
    (function next(){
      if(k>=seq.length){ bridge=finalB; token=finalT; animBreak.clear();animPop.clear();animFade.clear(); animating=false; render(); return; }
      const a=seq[k++];
      if(a.t==="break"){ animBreak.add(a.ei); render();
        setTimeout(()=>{ animBreak.delete(a.ei); bridge.delete(a.ei); render(); setTimeout(next,220); }, 640); }
      else if(a.t==="del"){ animFade.add(a.i); render();
        setTimeout(()=>{ animFade.delete(a.i); token[a.i]=null; render(); setTimeout(next,160); }, 420); }
      else { const owner=finalT[a.i]; const fromEl=document.getElementById("side"+owner); const islEl=islesEl.children[a.i]; const em=owner===0?"🐝":"🦋";
        flyEl(fromEl, islEl, '<div style="font-size:34px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))">'+em+'</div>', 620, function(){
          token[a.i]=finalT[a.i]; animPop.add(a.i); render();
          setTimeout(()=>{ animPop.delete(a.i); render(); setTimeout(next,180); }, 520);
        }); }
    })();
  }
  const bridgesOnBoard=p=>{let n=0;for(const [,o] of bridge)if(o===p)n++;return n;};
  const tokenCount=p=>token.reduce((s,t)=>s+(t===p?1:0),0);

  // ---- actions ----
  function tapCard(k){ // k = index in hand array
    if(gameOver) return;
    sel = (sel===k)? null : k;
    render();
    if(sel!=null) setMsg("이 섬에서 나가는 <b>빈 연결선</b>(초록 점선)을 눌러 다리를 놓으세요.","good");
  }
  function buildOn(ei){
    if(gameOver||animating||sel==null) return;
    const island=hands[turn][sel];
    if(!INC[island].includes(ei)) { setMsg("그 연결선은 고른 섬에서 나가지 않아요.","warn"); return; }
    if(bridge.has(ei)){ setMsg("이미 다리가 있어요.","warn"); return; }
    pushHist(); bridge.set(ei,turn); lastEdge=ei;
    discard.push(island); hands[turn].splice(sel,1); sel=null;
    const bB=new Map(bridge), bT=token.slice();
    resolveControl(turn, ei);
    const fB=new Map(bridge), fT=token.slice();
    animateResolve(bB,bT,fB,fT);
    setMsg("다리를 놓았어요! 더 두거나, 아래에서 카드를 뽑아 차례를 넘기세요.","good");
  }
  function tapEdge(ei){
    if(gameOver||animating) return;
    const owner=bridge.get(ei);
    if(owner===undefined){ // free edge -> build if a card selected & incident
      if(sel!=null) buildOn(ei);
      return;
    }
    if(owner===turn){ setMsg("내 다리예요. 상대 다리만 제거할 수 있어요.","warn"); return; }
    // remove opponent bridge: need 2 cards {X,X}|{Y,Y}|{X,Y}
    const [x,y]=EDGES[ei];
    const h=hands[turn];
    const idxX=h.indexOf(x), idxY=h.indexOf(y);
    let use=null;
    if(idxX>=0 && idxY>=0) use=[idxX,idxY];
    else { const xs=h.filter(v=>v===x).length, ys=h.filter(v=>v===y).length;
      if(xs>=2){ const a=h.indexOf(x); const b=h.indexOf(x,a+1); use=[a,b]; }
      else if(ys>=2){ const a=h.indexOf(y); const b=h.indexOf(y,a+1); use=[a,b]; } }
    if(!use){ setMsg(`제거하려면 <b>${FLOWER[x]}</b>·<b>${FLOWER[y]}</b> 섬 카드로 2장이 필요해요(같은 섬 2장 또는 양쪽 1장씩).`,"warn"); return; }
    pushHist(); bridge.delete(ei); lastEdge=-1;
    use.sort((a,b)=>b-a).forEach(k=>{ discard.push(h[k]); h.splice(k,1); });
    sel=null;
    const bB=new Map(bridge), bT=token.slice();
    resolveControl(turn, ei);
    const fB=new Map(bridge), fT=token.slice();
    animateResolve(bB,bT,fB,fT);
    setMsg("상대 다리를 제거했어요!","good");
  }
  function canDraw(){ return hands[turn].length<5 && deck.length>0; }
  function drawCard(){
    if(gameOver||animating) return;
    if(hands[turn].length>=5){ endTurnNoDraw(); return; }
    pushHist();
    if(deck.length){
      const deckEl=drawsEl.querySelector(".dcard.deck"), toEl=document.getElementById("side"+turn);
      animating=true;
      flyEl(deckEl, toEl, '<div style="width:44px;height:58px;border-radius:9px;background:repeating-linear-gradient(45deg,#d3e6bf 0 6px,#bcd3a4 6px 12px);border:3px solid #6f9350;box-shadow:0 5px 12px rgba(0,0,0,.35)"></div>', 620, function(){
        animating=false; hands[turn].push(deck.pop()); finishTurn();
      });
      return;
    }
    finishTurn();
  }
  function endTurnNoDraw(){ if(gameOver) return; finishTurn(); }
  function finishTurn(){
    sel=null;
    // round end? no cards to draw anymore (deck & faceUp empty)
    if(deck.length===0){ scoreRound(); return; }
    turn^=1; revealed=false; render(); setMsg(`<b>${pname(turn)}</b> 차례!`,"good");
    maybeAI();
  }

  function scoreRound(){
    // zero-bridge loss
    if(bridgesOnBoard(0)===0 && round>=1){ return finish(1,"상대의 다리가 하나도 남지 않았어요!"); }
    if(bridgesOnBoard(1)===0 && round>=1){ return finish(0,"상대의 다리가 하나도 남지 않았어요!"); }
    const t0=tokenCount(0),t1=tokenCount(1);
    let note="";
    if(round===1){ if(t0>t1) scores[0]+=1; else if(t1>t0) scores[1]+=1; note="1라운드"; }
    else if(round===2){ if(t0>t1) scores[0]+=2; else if(t1>t0) scores[1]+=2; note="2라운드"; }
    else { const diff=Math.abs(t0-t1); if(t0>t1) scores[0]+=diff; else if(t1>t0) scores[1]+=diff; note="마지막"; }
    if(round<3){
      // reshuffle discard into new deck + faceUp; bridges/tokens/hands persist
      deck=shuffle(discard.slice()); discard=[];
      round++; turn^=1; revealed=false; render();
      setMsg(`${note} 지배 ${t0}:${t1} → 점수 갱신! (${scores[0]}:${scores[1]}) — ${round}라운드 시작, <b>${pname(turn)}</b> 차례.`,"good");
      maybeAI();
    } else {
      render();
      const w = scores[0]>scores[1]?0 : (scores[1]>scores[0]?1 : -1);
      finish(w, `최종 점수 ${scores[0]} : ${scores[1]}`);
    }
  }
  function finish(winner,text){
    gameOver=true; winnerP=winner;
    if(winner===-1){ mIcon.textContent="🤝"; mTitle.textContent="무승부!"; }
    else { mIcon.textContent="🏆"; mTitle.textContent=`${pname(winner)} 승리! 🎉`; }
    mText.textContent=text||""; setMsg(winner===-1?"무승부!":`🎉 ${pname(winner)} 승리!`,"good");
    render(); overlay.classList.add("show");
  }

  // ---- render ----
  function render(){
    uiLock = (mode==="cpu"&&turn===1) || gameOver || animating;
    renderScore();
    // edges svg
    let s="";
    EDGES.forEach((e,ei)=>{ const [a,b]=e; const [x1,y1]=POS[a],[x2,y2]=POS[b];
      const owner=bridge.get(ei);
      if(owner===undefined){
        const buildable = sel!=null && INC[hands[turn][sel]] && INC[hands[turn][sel]].includes(ei);
        s+=`<line class="edge-free${buildable?' buildable':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      } else {
        s+=`<line class="edge-b${owner}${ei===lastEdge?' edge-last':''}${animBreak.has(ei)?' edge-break':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      }
      // hit line for interaction
      s+=`<line class="hit edge-rem" data-ei="${ei}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    });
    edgesSvg.innerHTML=s;
    if(!uiLock) edgesSvg.querySelectorAll(".hit").forEach(l=>{ l.addEventListener("click",()=>tapEdge(+l.dataset.ei)); });
    // islands
    islesEl.innerHTML="";
    for(let i=0;i<12;i++){ const el=document.createElement("div"); el.className="isl";
      el.style.left=POS[i][0]+"%"; el.style.top=POS[i][1]+"%";
      const tc=(animPop.has(i)?" pop":"")+(animFade.has(i)?" fade":"");
      el.innerHTML=FLOWER[i]+(token[i]!=null?`<span class="tok p${token[i]}${tc}">${token[i]===0?"🐝":"🦋"}</span>`:"");
      islesEl.appendChild(el);
    }
    renderSides(); renderDraws();
  }
  function renderScore(){
    scorebar.innerHTML="";
    [0,1].forEach(p=>{ const c=document.createElement("div"); c.className="sc"+(p===turn&&!gameOver?" turn":"");
      c.innerHTML=`<span class="dot" style="background:${p===0?'var(--p0)':'var(--p1)'}"></span>${pname(p)} · ${scores[p]}점 · 지배 ${tokenCount(p)}`;
      scorebar.appendChild(c); });
    const r=document.createElement("div"); r.className="round"; r.textContent=`${round}/3 라운드`; scorebar.appendChild(r);
  }
  function handFaceUp(p){ if(mode==="cpu") return p===0; return p===turn && revealed; }
  function renderSides(){
    for(const p of [0,1]){ const sideEl=document.getElementById("side"+p); sideEl.className="side"+(p===winnerP?" win":""); sideEl.innerHTML="";
      const head=document.createElement("div"); head.className="sidehead"+((p===turn&&!gameOver)?" turn":"");
      const trophy=(p===winnerP)?"🏆 ":"";
      head.innerHTML=trophy+(p===0?"🐝 노랑벌":"🦋 보라나비")+(mode==="cpu"&&p===1?" 🤖":"")+`<br><span class="cnt">패 ${hands[p].length}장</span>`;
      sideEl.appendChild(head);
      if(mode==="two" && p===turn && !gameOver){ const rb=document.createElement("button"); rb.className="revealbtn"; rb.textContent=revealed?"패 숨기기":"패 보기";
        rb.addEventListener("click",()=>{ revealed=!revealed; render(); }); sideEl.appendChild(rb); }
      const col=document.createElement("div"); col.className="handcol"; const fu=handFaceUp(p);
      hands[p].forEach((isl,k)=>{ const c=document.createElement("div");

    {c:"aspect",w:"데굴데굴",e:"⚪"},{c:"aspect",w:"뒤뚱뒤뚱",e:"🐧"},{c:"aspect",w:"살금살금",e:"🐾"},{c:"aspect",w:"깡충깡충",e:"🐰"},{c:"aspect",w:"둥실둥실",e:"🎈"},{c:"aspect",w:"꼬물꼬물",e:"🐛"},{c:"aspect",w:"방긋방긋",e:"😊"},{c:"aspect",w:"알록달록",e:"🌈"},{c:"aspect",w:"뭉게뭉게",e:"☁️"},{c:"aspect",w:"보들보들",e:"🧸"},{c:"aspect",w:"팔랑팔랑",e:"🦋"},{c:"aspect",w:"대롱대롱",e:"🍒"},{c:"aspect",w:"성큼성큼",e:"🚶"},{c:"aspect",w:"뒹굴뒹굴",e:"🛌"},{c:"aspect",w:"반들반들",e:"🥚"},{c:"aspect",w:"울퉁불퉁",e:"🪨"}
  ];
  const ENDINGS=[
    "그래서 모두 함께 꿀잔치를 열었답니다. 🍯",
    "그렇게 작은 애벌레는 멋진 나비가 되었답니다. 🦋",
    "결국 여왕이 되어 개미굴을 다스렸답니다. 👑",
    "다시는 거미줄 근처에 가지 않기로 했답니다. 🕸️",
    "둘은 세상에서 가장 친한 친구가 되었답니다. 🤝",
    "반딧불이들이 밤하늘을 환하게 밝혔답니다. ✨",
    "모두 포근한 나뭇잎 아래서 잠들었답니다. 😴",
    "봄이 오자 정원은 다시 꽃으로 가득 찼답니다. 🌸",
    "그리고 오래오래 행복하게 살았답니다. 💕",
    "마침내 잃어버린 집을 찾았답니다. 🏡",
    "모두 힘을 합쳐 추운 겨울을 이겨냈답니다. ❄️",
    "작은 영웅의 이야기는 숲속 전설이 되었답니다. 🌟",
    "그날 이후 숲속 친구들은 서로 돕고 살았답니다. 🤝",
    "작은 씨앗은 자라서 커다란 나무가 되었답니다. 🌳",
    "무지개를 따라가 보물을 나누어 가졌답니다. 🌈",
    "노래를 부르자 온 숲이 함께 춤을 추었답니다. 🎶",
    "용기를 낸 덕분에 모두를 구할 수 있었답니다. 💪",
    "다 함께 손잡고 무지개 다리를 건넜답니다. 🌈",
    "별에게 소원을 빌자 꿈이 이루어졌답니다. 🌠",
    "친구들과 나누어 먹으니 훨씬 맛있었답니다. 🍰",
    "다 같이 부른 노래가 온 정원에 울려 퍼졌답니다. 🎵",
  ];
  const HAND_SIZE=6;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
  const pname=p=>p===0?"파랑 이야기꾼":"초록 이야기꾼";

  const handLbl=document.getElementById("handLbl");
  const endrow=document.getElementById("endrow");
  const overlay=document.getElementById("overlay");
  const mTitle=document.getElementById("mTitle"), mText=document.getElementById("mText");
  const grabBtn=document.getElementById("grabBtn");

  // Comment: 각 카테고리를 Fisher–Yates로 섞은 뒤, 손패가 5개 카테고리를 고루 갖도록 나눠줍니다.
  const CAT_KEYS=["char","place","item","event","aspect"];
  function newGame(){
    hist=[];
    // 1) 카테고리별로 나눠 Fisher–Yates 셔플
    const pools={}; CAT_KEYS.forEach(k=>pools[k]=[]);
    ELEMENTS.forEach(c=>{ if(pools[c.c]) pools[c.c].push({...c}); });
    CAT_KEYS.forEach(k=>shuffle(pools[k]));
    // 2) 손패 나누기: 먼저 카테고리마다 한 장씩(골고루), 남으면 임의 카테고리에서 채움
    function dealHand(){
      const hand=[];
      for(const cat of shuffle(CAT_KEYS.slice())){ if(hand.length>=HAND_SIZE) break; if(pools[cat].length) hand.push(pools[cat].pop()); }
      while(hand.length<HAND_SIZE){ const avail=CAT_KEYS.filter(k=>pools[k].length); if(!avail.length) break; const cat=avail[(Math.random()*avail.length)|0]; hand.push(pools[cat].pop()); }
      return shuffle(hand); // 손 안에서 순서도 섞어 카테고리가 규칙적으로 안 보이게
    }
    hands=[dealHand(), dealHand()];
    const es=shuffle(ENDINGS.slice());
    endings=[es[0], es[1]];
    story=[]; narrator=0; gameOver=false; winnerP=-1;
    overlay.classList.remove("show");
    render();
  }

  function cardHTML(card, kind){
    return `<div class="card ${card.c}">`+
      `<div class="ccat">${CATS[card.c]||""}</div>`+
      `<div class="cemoji">${card.e}</div>`+
      `<div class="cword">${card.w}</div></div>`;
  }
  function snap(){ return JSON.stringify({hands:hands,endings:endings,story:story,narrator:narrator,gameOver:gameOver,winnerP:winnerP}); }
  function pushHist(){ hist.push(snap()); if(hist.length>80) hist.shift(); }
  function undoStory(){ if(!hist.length){ return; } const o=JSON.parse(hist.pop()); hands=o.hands; endings=o.endings; story=o.story; narrator=o.narrator; gameOver=o.gameOver; winnerP=o.winnerP; overlay.classList.remove("show"); render(); if(storyEl) storyEl.scrollLeft=storyEl.scrollWidth; }
  function playCard(k){
    if(gameOver) return;
    pushHist();
    const card=hands[narrator][k]; if(!card) return;
    hands[narrator].splice(k,1);
    story.push({...card, by:narrator});
    render();
    // scroll story to end
    storyEl.scrollLeft=storyEl.scrollWidth;
  }
  function finishStory(){
    if(gameOver || hands[narrator].length>0) return;
    pushHist();
    story.push({c:"ending", w:endings[narrator], e:"📕", by:narrator});
    render(); storyEl.scrollLeft=storyEl.scrollWidth;
    gameOver=true; winnerP=narrator; render();
    mTitle.textContent=`${pname(narrator)} 승리! 🎉`;
    mText.textContent=`“${endings[narrator]}”\n멋진 이야기로 끝을 맺었어요!`;
    overlay.classList.add("show");
  }
  function grab(){
    if(gameOver) return;
    pushHist(); narrator=1-narrator;
    render();
  }

  function render(){
    // turnbar
    turnbar.innerHTML="";
    [0,1].forEach(p=>{ const w=document.createElement("div"); w.className="who "+(p===0?"p0":"p1")+(p===narrator&&!gameOver?" active":"");
      w.textContent=(p===0?"🔵 ":"🟠 ")+pname(p)+` · 카드 ${hands[p].length}`; turnbar.appendChild(w); });
    // story line
    storyEl.innerHTML="";
    story.forEach(card=>{ const d=document.createElement("div"); d.innerHTML=cardHTML(card); const el=d.firstChild;
      el.style.outline = card.by===0?"3px solid rgba(47,110,204,.6)":"3px solid rgba(42,161,78,.65)";
      storyEl.appendChild(el); });
    // both players' hands (always visible; only current narrator's are playable)
    for(const p of [0,1]){
      const side=document.getElementById("pside"+p); side.className="pside p"+p+((p===narrator&&!gameOver)?" active":"")+(p===winnerP?" win":"");
      document.getElementById("phlbl"+p).innerHTML=(p===winnerP?"🏆 ":"")+(p===0?"🔵 파랑":"🟢 초록")+`의 카드 (${hands[p].length}장)`+((p===narrator&&!gameOver)?" — 이야기할 차례!":"");
      const he=document.getElementById("hand"+p); he.innerHTML="";
      hands[p].forEach((card,k)=>{ const d=document.createElement("div"); d.innerHTML=cardHTML(card); const el=d.firstChild;
        if(p!==narrator||gameOver){ el.classList.add("dim"); }
        else { el.addEventListener("click",()=>playCard(k)); }
        he.appendChild(el); });
      if(hands[p].length===0){ const s=document.createElement("div"); s.style.cssText="font-family:Jua;color:var(--muted);font-size:12px;padding:10px 6px"; s.textContent=(p===narrator&&!gameOver)?"카드를 다 썼어요! 아래 엔딩으로 끝맺어요 👇":"카드를 다 냈어요"; he.appendChild(s); }
    }
    // endings (both visible)
    endrow.innerHTML="";
    for(const p of [0,1]){ const ec=document.createElement("div");
      const open = p===narrator && hands[p].length===0 && !gameOver;
      ec.className="miniend p"+p+(open?" open":"");
      ec.innerHTML=(p===0?"🔵":"🟢")+" 엔딩: “"+endings[p]+"”"+(open?" ▶ 끝맺기":"");
      if(open) ec.addEventListener("click",finishStory);
      endrow.appendChild(ec);
    }
    grabBtn.disabled=gameOver;
  }

  grabBtn.addEventListener("click",grab);
  document.getElementById("resetBtn").addEventListener("click",newGame);
  document.getElementById("undoBtn").addEventListener("click",undoStory);
  document.getElementById("mBtn").addEventListener("click",function(){document.querySelector(".overlay").classList.remove("show");});
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("show");});
  (function(){var b=document.getElementById("rulesFab"),o=document.getElementById("rulesOverlay");
    b.addEventListener("click",()=>o.classList.add("show")); o.addEventListener("click",()=>o.classList.remove("show"));})();
  newGame();
})();
</script>

  var ov=document.getElementById("tutOverlay"),em=document.getElementById("tutEmoji"),tx=document.getElementById("tutText"),dt=document.getElementById("tutDots");

    pv.disabled=(i===0); nx.textContent=(i===TUT.length-1)?"시작! \u2728":"다음 \u25B6"; }
  function open(){ i=0; ov.classList.add("show"); show(); }

  cl.addEventListener("click",function(){ ov.classList.remove("show"); });
  ov.addEventListener("click",function(e){ if(e.target===ov) ov.classList.remove("show"); });
})();</script>

<script id="haptics">
(function(){
  var inFrame=false; try{ inFrame=(window.parent && window.parent!==window); }catch(e){ inFrame=true; }
  function buzz(p){
    if(inFrame){ try{ parent.postMessage({type:'buzz',p:p},'*'); return; }catch(e){} }
    try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){}
  }
  window.__buzz=buzz;
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest('button')){ buzz(8); return; }
    if(e.target.closest('.board,.cell,.disc,.hex,.tile,.htile,.card,.worm,.cseg,.token,.piece,.node,.stone,.slot,.gcell,.bcell,.pit,#board,.boardwrap,.hexwrap,.grid,svg')){ buzz(13); }
  },true);
  function watch(el){ if(!el) return; try{ new MutationObserver(function(ms){ for(var i=0;i<ms.length;i++){ if(ms[i].attributeName==='class' && el.classList.contains('show')){ buzz([26,38,32]); break; } } }).observe(el,{attributes:true,attributeFilter:['class']}); }catch(e){} }
  function initWatch(){ var seen=[]; ['#overlay','#result','#win','#gameover','#endOverlay','#resultOverlay'].forEach(function(s){ var el=document.querySelector(s); if(el&&seen.indexOf(el)<0){seen.push(el);watch(el);} }); document.querySelectorAll('.overlay').forEach(function(el){ if(el.classList.contains('rulesOverlay')) return; if(seen.indexOf(el)<0){seen.push(el);watch(el);} }); }
  if(document.readyState!=='loading') initWatch(); else window.addEventListener('DOMContentLoaded',initWatch);
})();
</script>
